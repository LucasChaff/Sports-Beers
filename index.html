function toggleLbExpanded() {
  _lbExpanded = !_lbExpanded;
  const extras = document.querySelectorAll('.lb-extra-row');
  const btn = document.getElementById('lb-expand-btn');
  const label = document.getElementById('lb-expand-label');

  if (_lbExpanded) {
    // Show extra rows with a smooth transition
    extras.forEach((el, i) => {
      el.style.display = 'flex';
      el.style.opacity = '0';
      el.style.transform = 'translateY(-6px)';
      el.style.transition = `opacity .25s ease ${i * 18}ms, transform .25s ease ${i * 18}ms`;
      requestAnimationFrame(() => requestAnimationFrame(() => {
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      }));
    });
    if (label) label.innerHTML = '↑ Réduire';
  } else {
    // Hide extra rows instantly (scroll back up first)
    extras.forEach(el => {
      el.style.display = 'none';
      el.style.opacity = '';
      el.style.transform = '';
      el.style.transition = '';
    });
    if (label) label.innerHTML = '↓ Voir plus <span style="color:var(--muted);font-size:11px">(top 50)</span>';
    // Scroll the leaderboard card into view
    if (btn) btn.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
}

function toggleSeriesRound(round) {
  const safeId = round.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
  const body   = document.getElementById('sr-body-' + safeId);
  const arrow  = document.getElementById('sr-arrow-' + safeId);
  if (!body) return;

  const isOpen = seriesPageOpen[round] !== false;
  seriesPageOpen[round] = !isOpen;

  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + 'px';
    body.style.overflow  = 'hidden';
    requestAnimationFrame(() => {
      body.style.transition = 'max-height .35s cubic-bezier(.4,0,.2,1), opacity .28s ease';
      body.style.maxHeight  = '0';
      body.style.opacity    = '0';
    });
    if (arrow) { arrow.style.transition = 'transform .35s ease'; arrow.style.transform = 'rotate(0deg)'; }
  } else {
    body.style.maxHeight  = '0';
    body.style.overflow   = 'hidden';
    body.style.opacity    = '0';
    body.style.display    = 'block';
    body.style.transition = 'max-height .38s cubic-bezier(.4,0,.2,1), opacity .3s ease';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        body.style.maxHeight = body.scrollHeight + 'px';
        body.style.opacity   = '1';
      });
    });
    body.addEventListener('transitionend', () => {
      body.style.overflow  = 'visible';
      body.style.maxHeight = 'none';
    }, { once: true });
    if (arrow) { arrow.style.transition = 'transform .35s ease'; arrow.style.transform = 'rotate(180deg)'; }
  }
}

function renderSeriesPageInner() {
  const ROUND_ORDER = ['Premier tour','Demi-finales','Finales de conférence','Finales NBA'];
  const rounds = [...new Set(state.series.map(s => s.round))]
    .sort((a,b) => ROUND_ORDER.indexOf(a) - ROUND_ORDER.indexOf(b));

  return rounds.map(r => {
    const seriesInRound = state.series.filter(s => s.round === r);

    // Round-level status: finished if all done, live if any locked/live, upcoming otherwise
    const allFinished = seriesInRound.every(s => s.status === 'finished');
    const anyLive     = seriesInRound.some(s => {
      if (s.status === 'finished') return false;
      if (isLocked(s)) return true;
      return false;
    });
    const roundBadge = allFinished
      ? `<span class="badge badge-green">✓ Terminé</span>`
      : anyLive
        ? `<span class="badge badge-amber" style="gap:6px"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);animation:pulse 1.4s infinite"></span>En cours</span>`
        : `<span class="badge badge-gray">À venir</span>`;

    // Count finished series
    const finishedCount = seriesInRound.filter(s => s.status === 'finished').length;
    const total = seriesInRound.length;

    const isOpen = seriesPageOpen[r] !== false; // open by default
    if (seriesPageOpen[r] === undefined) seriesPageOpen[r] = true;

    const seriesHTML = seriesInRound.map(s => {
      const allGames = state.games[s.id] || [];
      const preds = allPreds(s.id);
      const locked = isLocked(s);

      // Compute live score from finished games
      const finishedGames = allGames.filter(g => g.status === 'finished');
      let wins1 = 0, wins2 = 0;
      finishedGames.forEach(g => {
        if (g.winner === s.team1) wins1++;
        else if (g.winner === s.team2) wins2++;
      });

      // Series status label + badge
      let statusBadge = '';
      if (s.status === 'finished') {
        statusBadge = `<span class="badge badge-green">✓ Terminé</span>`;
      } else if (locked && finishedGames.length > 0) {
        statusBadge = `<span class="badge badge-amber" style="gap:5px"><span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--amber);animation:pulse 1.4s infinite"></span>En cours</span>`;
      } else if (locked) {
        statusBadge = `<span class="badge badge-amber">🔒 Verrouillé</span>`;
      } else {
        statusBadge = `<span class="badge badge-green">Ouvert</span>`;
      }

      // Score display
      const showScore = finishedGames.length > 0;
      const scoreHTML = showScore
        ? `<div style="display:flex;align-items:center;gap:8px;margin:8px 0">
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:${wins1>wins2?'var(--green)':wins1<wins2?'var(--muted)':'var(--text)'}">${wins1}</span>
            <span style="font-size:14px;color:var(--muted);font-weight:700">–</span>
            <span style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:900;color:${wins2>wins1?'var(--green)':wins2<wins1?'var(--muted)':'var(--text)'}">${wins2}</span>
          </div>`
        : '';

      // Filter games to display:
      // - If finished: only show played games (hide unplayed ones)
      // - If in progress: show played + next upcoming (first non-finished)
      // - If upcoming: show nothing (no games played yet)
      let gamesToShow = [];
      if (s.status === 'finished') {
        gamesToShow = allGames.filter(g => g.status === 'finished');
      } else if (locked) {
        const nextGame = allGames.find(g => g.status !== 'finished');
        gamesToShow = [
          ...allGames.filter(g => g.status === 'finished'),
          ...(nextGame ? [nextGame] : [])
        ];
      }
      // sort by game_number
      gamesToShow.sort((a,b) => a.game_number - b.game_number);

      const gamesHTML = gamesToShow.length ? `
        <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px">
          ${gamesToShow.map(g => `
            <div class="game-row">
              <span style="min-width:62px;font-size:12px;color:var(--muted)">Match ${g.game_number}</span>
              <span style="flex:1;font-size:12px;color:var(--muted)">${g.start_time ? fmtDate(g.start_time) : ''}</span>
              ${g.status === 'finished'
                ? `<span class="badge badge-green">🏆 ${g.winner}</span>`
                : isGameLocked(g)
                  ? `<span class="badge badge-amber">🔒 À venir</span>`
                  : `<span class="badge badge-gray">À venir</span>`}
            </div>`).join('')}
          ${(() => {
            const live = state.liveScores[s.id];
            return live ? `<div id="live-score-${s.id}">${_liveScoreHTML(s.id, live)}</div>` : `<div id="live-score-${s.id}"></div>`;
          })()}
        </div>` : `<div id="live-score-${s.id}">${state.liveScores[s.id] ? _liveScoreHTML(s.id, state.liveScores[s.id]) : ''}</div>`;

      return `<div class="card" style="margin-top:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted)">
            ${s.conference && s.conference !== '—' ? s.conference + ' · ' : ''}${s.round}
          </span>
          ${statusBadge}
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <div style="flex:1">
            ${vsTeamHTML(s.team1, false, s.team1_seed ?? null)}
          </div>
          ${showScore
            ? scoreHTML
            : `<div class="vs-sep">VS</div>`}
          <div style="flex:1;display:flex;justify-content:flex-end">
            ${vsTeamHTML(s.team2, true, s.team2_seed ?? null)}
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center">
          <span class="badge badge-gray">${preds.length} pronostic(s)</span>
          ${s.start_time ? `<span class="badge badge-blue">⏰ ${fmtDate(s.start_time)}</span>` : ''}
          ${finishedGames.length > 0 ? `<button class="btn btn-sm" style="margin-left:auto;font-size:11px;padding:5px 12px;border-radius:10px" onclick="openSeriesStats('${s.id}','${s.team1}','${s.team2}')">📊 Stats ESPN</button>` : ''}
        </div>
        ${gamesHTML}
      </div>`;
    }).join('');

    const safeId = r.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
    return `
      <div style="margin:0 12px 6px">
        <button onclick="toggleSeriesRound('${r}')"
          style="width:100%;display:flex;align-items:center;justify-content:space-between;
                 background:var(--card);border:1px solid var(--border2);border-radius:16px;
                 padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s;text-align:left"
          onmouseover="this.style.background='var(--card2)';this.style.borderColor='rgba(255,255,255,0.2)'"
          onmouseout="this.style.background='var(--card)';this.style.borderColor='var(--border2)'">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;
                         text-transform:uppercase;letter-spacing:0.05em;color:var(--text)">${r}</span>
            ${roundBadge}
            <span style="font-size:11px;color:var(--muted)">${finishedCount}/${total}</span>
          </div>
          <span id="sr-arrow-${safeId}" style="font-size:16px;color:var(--muted);
                       transform:rotate(${isOpen?'180':'0'}deg);display:inline-block">▼</span>
        </button>
        <div id="sr-body-${safeId}"
             style="margin-top:2px;${isOpen?'':'display:none;max-height:0;overflow:hidden;opacity:0'}">
          ${seriesHTML}
        </div>
      </div>`;
  }).join('');
}

async function checkAdmin() {
  const input = document.getElementById('admin-code-input');
  const code = (input?.value || '').trim();

  if (!code) return toast('❌ Entre le code admin');

  const storedRaw = state.settings['admin_password'];
  const stored = String(storedRaw ?? '').trim();

  if (!stored) {
    toast("❌ Aucun mot de passe admin n'est configuré");
    return;
  }

  // Comparer en hashant ce que l'utilisateur a tapé
  const hashed = await sha256(code);
  const match = stored.startsWith('$sha256$') ? stored === '$sha256$' + hashed : code === stored;

  if (match) {
    state.adminAuthed = true;
    state.currentPage = 'admin';
    render();
    return;
  }

  toast('❌ Code incorrect');
}

      let w1b = 0, w2b = 0;
      finishedBefore.forEach(x => { if(x.winner===s.team1) w1b++; else if(x.winner===s.team2) w2b++; });
      const unreachable = s.status !== 'finished' && g.status !== 'finished' && (w1b >= 4 || w2b >= 4);

      if (unreachable) return `<div class="game-row" style="opacity:0.3">
        <span style="min-width:62px;font-size:12px;color:var(--muted)">Match ${g.game_number}</span>
        <span style="flex:1;font-size:12px;color:var(--dim)">Non joué</span>
      </div>`;

      const gidSafe = g.id.replace(/-/g,'_');
      return `<div class="game-row">
        <span style="min-width:62px;font-size:12px;color:var(--muted)">Match ${g.game_number}</span>
        <span style="flex:1;font-size:11px;color:var(--muted)">${fmtDate(g.start_time)}</span>
        ${g.status==='finished'
          ? `<div style="display:flex;align-items:center;gap:6px">
               <span class="badge badge-green">🏆 ${g.winner}</span>
               <button class="btn btn-sm btn-danger" style="font-size:10px;padding:3px 8px" onclick="toggleCorrectGame('${gidSafe}')">✏️</button>
             </div>
             <div id="game-edit-${gidSafe}" style="display:none;margin-top:4px;display:none;gap:6px;align-items:center">
               <select id="gres-${gidSafe}" style="font-size:12px;padding:4px 8px;width:auto">
                 <option value="${s.team1}" ${g.winner===s.team1?'selected':''}>${s.team1}</option>
                 <option value="${s.team2}" ${g.winner===s.team2?'selected':''}>${s.team2}</option>
               </select>
               <button class="btn btn-sm btn-primary" style="padding:4px 10px;font-size:11px" onclick="doCorrectGameResult('${g.id}','${s.id}','${gidSafe}')">✓</button>
               <button class="btn btn-sm btn-ghost" style="padding:4px 8px;font-size:11px" onclick="toggleCorrectGame('${gidSafe}')">✕</button>
             </div>`
          : seriesOver
            ? `<span style="font-size:11px;color:var(--dim)">—</span>`
            : `<select id="gres-${gidSafe}" style="font-size:12px;padding:4px 8px;width:auto">
                <option value="">Résultat...</option>
                <option value="${s.team1}">${s.team1}</option>
                <option value="${s.team2}">${s.team2}</option>
              </select>
              <button class="btn btn-sm" style="padding:5px 10px" onclick="doSetGameResult('${g.id}','${s.id}','${gidSafe}')">✓</button>`
        }
      </div>`;
    }).join('')}

    <div style="margin-top:10px;display:flex;justify-content:flex-end">
      <button class="btn btn-sm btn-danger" onclick="deleteSeries('${s.id}')">🗑 Supprimer</button>
    </div>
  </div>`;
}

async function adminManualSync() {
  const btn = document.querySelector('[onclick="adminManualSync()"]');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ En cours…'; }

  _autoSyncLog = []; // reset log à chaque sync manuel
  let totalSynced = 0;
  for (const series of state.series) {
    // forceSync = true : vide le cache ESPN pour retenter même ce qui a déjà été cherché
    totalSynced += await syncSeriesResults(series, true);
  }

  _autoSyncLastRun = new Date();
  _autoSyncCount = totalSynced;
  _saveSyncState(_autoSyncLastRun.toISOString(), totalSynced, _autoSyncLog);

  if (totalSynced > 0) {
    computeLeaderboard();
    render();
    toast(`✅ ${totalSynced} résultat(s) synchronisé(s) depuis ESPN`);
  } else {
    toast('🔍 Aucun nouveau résultat trouvé sur ESPN');
  }

  _renderAdminSyncStatus();
  if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync maintenant'; }
}

async function doCorrectGameResult(gameId, seriesId, gidSafe) {
  const winner = document.getElementById('gres-' + gidSafe)?.value;
  if (!winner) return toast('Choisis le vainqueur !');
  if (!confirm('Corriger le résultat de ce match en "' + winner + '" ?')) return;

  // 1. Mettre à jour le match
  const { error } = await sb.from('games').update({ winner, status: 'finished' }).eq('id', gameId);
  if (error) { console.error(error); return toast('Erreur mise à jour match'); }

  // 2. Recharger les matchs pour recalculer
  await loadSeries();

  const series = state.series.find(s => s.id === seriesId);
  if (!series) return;

  const allGames = state.games[seriesId] || [];
  const finishedGames = allGames.filter(g => g.status === 'finished');
  let wins1 = 0, wins2 = 0;
  finishedGames.forEach(g => {
    if (g.winner === series.team1) wins1++;
    else if (g.winner === series.team2) wins2++;
  });

  const newWinner = wins1 >= 4 ? series.team1 : wins2 >= 4 ? series.team2 : null;
  const newTotal  = newWinner ? wins1 + wins2 : null;

  if (newWinner) {
    // Une equipe a toujours (ou de nouveau) 4 victoires -> re-finir la serie
    const snapshotBefore = new Set(state.series.filter(s => s.status === 'finished').map(s => s.id));
    await sb.from('series').update({ series_winner: newWinner, series_games: newTotal, status: 'finished' }).eq('id', seriesId);
    try { await sb.rpc('recalculate_points', { p_series_id: seriesId }); } catch(e) { console.warn(e); }
    await loadSeries();
    await loadPredictions();
    computeLeaderboard();
    checkAndShowResultBanner(snapshotBefore);
    skipNextSeriesRealtime += 1;
    render();
    toast('Match corrige - serie mise a jour (' + newWinner + ' en ' + newTotal + ')');
  } else {
    // Plus personne n'a 4 victoires -> rouvrir la serie
    await sb.from('series').update({ series_winner: null, series_games: null, status: 'locked' }).eq('id', seriesId);
    try { await sb.rpc('recalculate_points', { p_series_id: seriesId }); } catch(e) { console.warn(e); }
    await loadSeries();
    await loadPredictions();
    computeLeaderboard();
    skipNextSeriesRealtime += 1;
    render();
    toast('Match corrige - serie repassee en cours (' + wins1 + '-' + wins2 + ')');
  }
}

  const cfn = document.getElementById('s-champ-fn');
  if (ac2) updates['actual_champion'] = ac2.value;
  if (cr1) updates['points_champion_premier_tour'] = parseInt(cr1.value);
  if (csf) updates['points_champion_demi_finales'] = parseInt(csf.value);
  if (ccf) updates['points_champion_finales_conference'] = parseInt(ccf.value);
  if (cfn) updates['points_champion_finales_nba'] = parseInt(cfn.value);

  if (am)  updates['actual_mvp'] = am.value;
  if (mr1) updates['points_mvp_premier_tour'] = parseInt(mr1.value);
  if (msf) updates['points_mvp_demi_finales'] = parseInt(msf.value);
  if (mcf) updates['points_mvp_finales_conference'] = parseInt(mcf.value);
  if (mfn) updates['points_mvp_finales_nba'] = parseInt(mfn.value);
  if (ac && ac.value.trim())  updates['admin_password'] = '$sha256$' + await sha256(ac.value.trim());
  const lcc = document.getElementById('s-league-create-code');
  if (lcc && lcc.value.trim()) updates['league_create_code'] = '$sha256$' + await sha256(lcc.value.trim());
  else if (lcc && lcc.value.trim() === '') updates['league_create_code'] = '';

  await saveSettings(updates);
}

// Shortens team name for bracket display (max ~12 chars)
function shortTeamName(name) {
  const map = {
    'boston celtics':'Celtics','brooklyn nets':'Nets','new york knicks':'Knicks',
    'philadelphia 76ers':'Sixers','toronto raptors':'Raptors','chicago bulls':'Bulls',
    'cleveland cavaliers':'Cavaliers','detroit pistons':'Pistons','indiana pacers':'Pacers',
    'milwaukee bucks':'Bucks','atlanta hawks':'Hawks','charlotte hornets':'Hornets',
    'miami heat':'Heat','orlando magic':'Magic','washington wizards':'Wizards',
    'denver nuggets':'Nuggets','minnesota timberwolves':'T-Wolves','oklahoma city thunder':'Thunder',
    'portland trail blazers':'Blazers','utah jazz':'Jazz','golden state warriors':'Warriors',
    'los angeles clippers':'Clippers','los angeles lakers':'Lakers','phoenix suns':'Suns',
    'sacramento kings':'Kings','dallas mavericks':'Mavs','houston rockets':'Rockets',
    'memphis grizzlies':'Grizzlies','new orleans pelicans':'Pelicans','san antonio spurs':'Spurs',
  };
  return map[name.toLowerCase()] || name.split(' ').pop();
}

function bkTeamRow(name, score, isWinner, isLoser, isHome, seed) {
  const logo = teamLogo(name);
  const cls = isWinner ? 'winner' : isLoser ? 'loser' : '';
  const scoreCls = isWinner ? 'bk-score winning' : 'bk-score';
  const homeDot = (isHome && name !== 'À déterminer') ? `<span title="Avantage du terrain" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#e53e3e;margin-left:5px;flex-shrink:0"></span>` : '';
  return `<div class="bk-team ${cls}" style="display:flex;align-items:center">
    ${logo
      ? `<img class="bk-logo" src="${logo}" alt="" onerror="this.style.display='none'">`
      : `<div class="bk-logo-placeholder">🏀</div>`}
    <span class="bk-team-name">${name === 'À déterminer' ? 'À déterminer' : shortTeamName(name)}</span>
    ${homeDot}
    ${score !== null ? `<span class="${scoreCls}">${score}</span>` : ''}
  </div>`;
}

function bkMatchCard(series) {
  if (!series) {
    return `<div class="bk-tbd"><div class="bk-tbd-text">À déterminer</div></div>`;
  }

  const games = state.games[series.id] || [];
  const finishedGames = games.filter(g => g.status === 'finished');

  // Count wins per team
  let score1 = 0, score2 = 0;
  finishedGames.forEach(g => {
    if (g.winner === series.team1) score1++;
    else if (g.winner === series.team2) score2++;
  });

  const isFinished = series.status === 'finished';
  const hasStarted = isLocked(series);
  const isLive = !isFinished && hasStarted;

  const w = series.series_winner;
  const t1Win = isFinished && w === series.team1;
  const t1Lose = isFinished && w === series.team2;
  const t2Win = isFinished && w === series.team2;
  const t2Lose = isFinished && w === series.team1;

  let footer = '';
  if (isFinished) {
    footer = `<div class="bk-match-footer">✓ Terminé</div>`;
  } else if (isLive) {
    // Chercher un score live ESPN pour cette série
    const liveScore = state.liveScores[series.id];
    if (liveScore) {
      const ls1 = liveScore.team1Score;
      const ls2 = liveScore.team2Score;
      const lsLabel = liveScore.periodLabel || '';
      const lsClock = liveScore.clock || '';
      footer = `<div class="bk-match-footer live-dot" style="padding:5px 8px;line-height:1.4">
        <span style="font-family:'DM Mono',monospace;font-size:10px;font-weight:600;letter-spacing:0.02em;color:var(--amber)">${ls1} – ${ls2}</span>
        <span style="color:var(--muted);font-size:9px;margin-left:4px">${lsLabel}${lsClock ? ' ' + lsClock : ''}</span>
      </div>`;
    } else {
      footer = `<div class="bk-match-footer live-dot">En cours</div>`;
    }
  } else if (series.start_time) {
    const d = new Date(series.start_time);
    const label = d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
    footer = `<div class="bk-match-footer">↗ ${label}</div>`;
  } else {
    footer = `<div class="bk-match-footer">À venir</div>`;
  }

  const showScore = isFinished || isLive;
  const s1 = showScore ? score1 : null;
  const s2 = showScore ? score2 : null;
  const clickable = finishedGames.length > 0;

  // Home advantage: team with lowest seed
  const seed1 = series.team1_seed ?? null;
  const seed2 = series.team2_seed ?? null;
  const home1 = (seed1 != null && seed2 != null) ? seed1 < seed2 : true;
  const home2 = !home1;

  // footer est déjà une div complète — on l'identifie via un wrapper
  return `<div class="bk-match ${isFinished ? 'finished' : isLive ? 'live' : ''}${clickable ? ' bk-match-clickable' : ''}"
    ${clickable ? `onclick="openSeriesStats('${series.id}','${series.team1}','${series.team2}')" title="Voir les stats ESPN"` : ''}>
    ${bkTeamRow(series.team1, s1, t1Win, t1Lose, home1, seed1)}
    ${bkTeamRow(series.team2, s2, t2Win, t2Lose, home2, seed2)}
    <span id="bk-footer-${series.id}">${footer}</span>
  </div>`;
}

function getSeriesByRoundConf(round, conf) {
  return state.series.filter(s =>
    s.round === round &&
    (conf === null || s.conference === conf || s.conference === '—')
  );
}

// Returns the series that produced a given winner (to chain bracket rounds)
function getNextSeries(winner, round) {
  if (!winner) return null;
  return state.series.find(s => s.round === round && (s.team1 === winner || s.team2 === winner)) || null;
}

function renderBracket() {
  // Gather series by round
  const r1East = state.series.filter(s => s.round === 'Premier tour' && s.conference === 'Est');
  const r1West = state.series.filter(s => s.round === 'Premier tour' && s.conference === 'Ouest');
  const sfEast = state.series.filter(s => s.round === 'Demi-finales' && s.conference === 'Est');
  const sfWest = state.series.filter(s => s.round === 'Demi-finales' && s.conference === 'Ouest');
  const cfEast = state.series.filter(s => s.round === 'Finales de conférence' && s.conference === 'Est');
  const cfWest = state.series.filter(s => s.round === 'Finales de conférence' && s.conference === 'Ouest');
  const finals = state.series.find(s => s.round === 'Finales NBA') || null;

  // Pad arrays to expected size with nulls
  const pad = (arr, n) => [...arr, ...Array(Math.max(0, n - arr.length)).fill(null)];

  // Tri par bracket_position (0-indexé) — préserve la position verticale ESPN
  const sortByPos = arr => [...arr].sort((a, b) => (a?.bracket_position ?? 999) - (b?.bracket_position ?? 999));

  const e1  = pad(sortByPos(r1East), 4);
  const w1  = pad(sortByPos(r1West), 4);
  const esf = pad(sortByPos(sfEast), 2);
  const wsf = pad(sortByPos(sfWest), 2);
  const ecf = pad(cfEast, 1);
  const wcf = pad(cfWest, 1);

  // Champion
  const champion = finals?.series_winner || null;

  // ── Build columns ────────────────────────────────────────────────
  // We render: EastR1 | EastSF | EastCF | Finals+Trophy | WestCF | WestSF | WestR1

  function col(seriesArr, label, justify='center') {
    const cards = seriesArr.map(s => bkMatchCard(s));
    // Space cards evenly
    const gaps = seriesArr.length;
    return `<div class="bracket-round">
      <div class="bracket-round-label">${label}</div>
      <div style="display:flex;flex-direction:column;gap:${gaps<=2?'32px':gaps<=4?'12px':'8px'};justify-content:${justify}">
        ${cards.join('')}
      </div>
    </div>`;
  }

  // Trophy column
  const trophyCol = champion ? `
    <div class="bracket-round" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="bracket-round-label">Champion</div>
      <div class="bk-trophy">
        <div class="bk-trophy-icon">🏆</div>
        <div class="bk-trophy-name">${shortTeamName(champion)}</div>
        <div class="bk-trophy-sub">Champions NBA 2026</div>
      </div>
    </div>` : '';

  // Empty state
  if (!state.series.length) {
    return `<div class="empty"><span class="empty-icon">🗂</span>Aucune série configurée.<br>L'admin peut les ajouter depuis l'onglet Séries.</div>`;
  }

  return `
    <div style="padding:0 0 8px">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:6px;flex-wrap:wrap">
        <div class="bracket-hint" style="margin-bottom:0">← Fais défiler horizontalement →</div>
        <div style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted)">
          <span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#e53e3e;flex-shrink:0"></span>
          Avantage du terrain
        </div>
      </div>
      <div class="bracket-wrap">
        <div class="bracket-scroll">
          ${col(w1,   'Ouest — 1er tour')}
          ${col(wsf,  'Demi-finales Ouest')}
          ${col(wcf,  'Finale de conf Ouest')}
          ${col([finals], 'Finales NBA')}
          ${champion ? trophyCol : ''}
          ${col(ecf,  'Finale de conf Est')}
          ${col(esf,  'Demi-finales Est')}
          ${col(e1,   'Est — 1er tour')}
        </div>
      </div>
    </div>
  `;
}

function openPlayerProfile(playerId) {
  const existing = document.getElementById('profile-overlay');
  if (existing) existing.remove();

  const player = getPlayer(playerId);
  if (!player) return;

  const lbEntry = state.leaderboard.find(p => p.id === playerId) || {};
  const playerPreds = state.predictions.filter(p => p.player_id === playerId);
  const mvpPreds = state.mvpPredictions.filter(p => p.player_id === playerId);

  // ── Stats globales
  const totalPts   = lbEntry.total_points || 0;
  const totalPreds = playerPreds.length;
  const seriesFin  = state.series.filter(s => s.status === 'finished');

  // Taux de réussite vainqueur série
  let winOk = 0, winTotal = 0;
  // Taux score exact
  let exactOk = 0;
  // Taux matchs individuels
  let gameOk = 0, gameTotal = 0;

  playerPreds.forEach(pred => {
    const s = state.series.find(x => x.id === pred.series_id);
    if (!s || s.status !== 'finished') return;
    winTotal++;
    if (pred.predicted_series_winner === s.series_winner) {
      winOk++;
      if (Number(pred.predicted_series_games) === Number(s.series_games)) exactOk++;
    }
    const sGames = state.games[s.id] || [];
    const gPreds = pred.game_predictions || [];
    sGames.forEach(g => {
      if (g.status !== 'finished' || !g.winner) return;
      gameTotal++;
      const gp = gPreds.find(p => Number(p.game_number) === Number(g.game_number));
      if (gp && gp.predicted_winner === g.winner) gameOk++;
    });
  });

  const pctWin  = winTotal  ? Math.round(winOk  / winTotal  * 100) : null;
  const pctExact= winTotal  ? Math.round(exactOk/ winTotal  * 100) : null;
  const pctGame = gameTotal ? Math.round(gameOk / gameTotal * 100) : null;

  // ── Rang dans le leaderboard
  const rank = state.leaderboard.findIndex(p => p.id === playerId) + 1;

  // ── Séries avec pronostic
  const seriesRows = seriesFin.map(s => {
    const pred = playerPreds.find(p => p.series_id === s.id);
    if (!pred) return `
      <div class="profile-series-row">
        <div class="profile-series-icon" style="background:rgba(255,255,255,0.05)">—</div>
        <div style="flex:1">
          <div class="profile-series-teams">${s.team1} vs ${s.team2}</div>
          <div class="profile-series-pred" style="color:var(--muted)">Pas de pronostic</div>
        </div>
        <div class="profile-pts-badge" style="color:var(--muted)">—</div>
      </div>`;

    const winOk = pred.predicted_series_winner === s.series_winner;
    const exactOk = winOk && Number(pred.predicted_series_games) === Number(s.series_games);
    // Recompute from settings (same logic as computeLeaderboard, avoids stale DB values)
    const roundPoints = getRoundPoints(s.round);
    const _ptsSW = roundPoints.series;
    const _ptsSE = roundPoints.exact;
    const _ptsMW = roundPoints.match;
    let ptsSW  = winOk ? _ptsSW : 0;
    let ptsSE  = exactOk ? _ptsSE : 0;
    const sGamesForPts = state.games[s.id] || [];
    const gPredsForPts = pred.game_predictions || [];
    let ptsGame = 0;
    sGamesForPts.forEach(g => {
      if (g.status !== 'finished' || !g.winner) return;
      const gp = gPredsForPts.find(p => Number(p.game_number) === Number(g.game_number));
      if (gp && gp.predicted_winner === g.winner) ptsGame += _ptsMW;
    });

    // Double down : si actif → matchs doublés toujours ; sw/se doublés si vainqueur correct
    const dd = state.doubleDowns.find(d => d.player_id === playerId && d.series_id === s.id);
    const ddActive = !!dd;
    if (dd) { ptsGame *= 2; if (winOk) { ptsSW *= 2; ptsSE *= 2; } }

    const pts = ptsSW + ptsSE + ptsGame;

    const icon = exactOk ? '🎯' : winOk ? '✓' : '✗';
    const iconBg = exactOk
      ? 'rgba(29,185,84,0.15)' : winOk
      ? 'rgba(245,158,11,0.15)' : 'rgba(232,66,42,0.1)';
    const iconColor = exactOk
      ? 'var(--green)' : winOk
      ? 'var(--amber)' : 'var(--accent)';

    const chips = [];
    if (ptsSW > 0) chips.push(`<span style="color:var(--accent)">+${ptsSW} série</span>`);
    if (ptsSE > 0) chips.push(`<span style="color:var(--green)">+${ptsSE} exact</span>`);
    if (ptsGame > 0) chips.push(`<span style="color:var(--blue)">+${ptsGame} matchs</span>`);
    if (ddActive) chips.push(`<span style="color:var(--gold)">🎲 doublé</span>`);
    if (pts === 0) chips.push(`<span style="color:var(--muted)">0 pt</span>`);

    return `
      <div class="profile-series-row">
        <div class="profile-series-icon" style="background:${iconBg};color:${iconColor};font-size:18px">${icon}</div>
        <div style="flex:1;min-width:0">
          <div class="profile-series-teams" style="display:flex;align-items:center;gap:6px">
            ${s.team1} vs ${s.team2}
            ${dd ? `<span class="dd-badge" style="font-size:9px;padding:2px 6px">🎲</span>` : ''}
          </div>
          <div class="profile-series-pred">
            ${pred.predicted_series_winner} en ${pred.predicted_series_games}
            <span style="color:var(--muted)"> · réel : ${s.series_winner} en ${s.series_games}</span>
          </div>
          <div class="profile-series-result">${chips.join(' · ')}</div>
        </div>
        <div class="profile-pts-badge" style="color:${pts>0?(ddActive?'var(--gold)':'var(--gold)'):'var(--muted)'}">${pts>0?'+'+pts:'—'}</div>
      </div>`;
  }).join('');

  // ── MVP preds — visibles uniquement si le tour est verrouillé (isMvpLocked)
  const isViewingOwnProfile = playerId === state.currentPlayer?.id;
  const actualMvp = String(state.settings['actual_mvp'] ?? '').trim().toLowerCase();

  const mvpRowsArr = ['Premier tour','Demi-finales','Finales de conférence','Finales NBA'].map(round => {
    const mp = mvpPreds.find(p => p.playoff_round === round);
    const locked = isMvpLocked(round);
    const visible = isViewingOwnProfile || locked;

    if (!mp) {
      // Pas de pronostic du tout pour ce tour
      return `
        <div class="profile-series-row">
          <div class="profile-series-icon" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:16px">👑</div>
          <div style="flex:1">
            <div style="font-size:11px;color:var(--muted)">${round}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:2px">Aucun pronostic</div>
          </div>
          ${locked ? '' : '<span class="badge badge-blue">Ouvert</span>'}
        </div>`;
    }

    if (!visible) {
      // Tour pas encore verrouillé et ce n'est pas notre propre profil → caché
      return `
        <div class="profile-series-row">
          <div class="profile-series-icon" style="width:36px;height:36px;border-radius:50%;background:rgba(245,158,11,0.1);display:flex;align-items:center;justify-content:center;font-size:16px">🔒</div>
          <div style="flex:1">
            <div style="font-size:11px;color:var(--muted)">${round}</div>
            <div style="font-size:13px;color:var(--muted);margin-top:2px">Révélé au début du tour</div>
          </div>
          <span class="badge badge-amber">🔒</span>
        </div>`;
    }

    const hit = actualMvp && mp.predicted_mvp?.toLowerCase() === actualMvp;
    const candidate = MVP_CANDIDATES.find(c => c.name === mp.predicted_mvp);
    return `
      <div class="profile-series-row">
        <div class="profile-series-icon" style="width:36px;height:36px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.06)">
          ${candidate
            ? `<img src="${playerPhoto(candidate.espnId)}" style="width:100%;height:100%;object-fit:cover;object-position:top" onerror="this.style.display='none'">`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:16px">👑</div>`}
        </div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:600">${mp.predicted_mvp}</div>
          <div style="font-size:11px;color:var(--muted)">${round}</div>
        </div>
        <span class="badge ${actualMvp?(hit?'badge-green':'badge-red'):'badge-gray'}">${actualMvp?(hit?'✓ Correct':'✗ Raté'):'En attente'}</span>
      </div>`;
  });

  const mvpRows = mvpRowsArr.join('');

  // ── Accuracy bars
  function accBar(pct, color) {
    if (pct === null) return '<div style="font-size:12px;color:var(--muted);padding:0 20px 12px">Pas encore de données</div>';
    return `
      <div style="padding:0 20px 14px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
          <span style="color:var(--muted)">${pct}%</span>
        </div>
        <div class="profile-accuracy-bar">
          <div class="profile-accuracy-fill" style="width:${pct}%;background:${color}"></div>
        </div>
      </div>`;
  }

  const html = `
    <div class="profile-overlay" id="profile-overlay" onclick="handleProfileOverlayClick(event)">
      <div class="profile-sheet" onclick="event.stopPropagation()">

        <div class="profile-hero">
          <div class="profile-avatar" style="background:${player.avatar_color}22;color:${player.avatar_color};overflow:hidden;position:relative;cursor:${playerId === state.currentPlayer?.id ? 'pointer' : 'default'}" ${playerId === state.currentPlayer?.id ? `onclick="openAvatarModal('${playerId}', ${!!player.avatar_url})" title="Modifier ma photo"` : ''}>
            ${player.avatar_url
              ? `<img src="${player.avatar_url}" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`
              : initials(player.name)}

// State for the MVP picker modal
let mvpPickerState = { open:false, round:null };

function openMvpPicker(round) {
  mvpPickerState = { open:true, round };
  const existing = document.getElementById('mvp-overlay');
  if (existing) existing.remove();

  const pred = myMvpPred(round);
  const existingName = pred?.predicted_mvp || '';
  const isCandidate = MVP_CANDIDATES.some(c => c.name === existingName);

  const candidatesHTML = MVP_CANDIDATES.map(c => `
    <div class="mvp-card ${existingName===c.name?'selected':''}" id="mvpc-${c.espnId}" onclick="pickMvpDirect(event,'${round}','${c.name}','${c.espnId}')">
      <div class="mvp-card-photo">
        <img src="${playerPhoto(c.espnId)}" alt="${c.short}"
          onerror="this.parentElement.innerHTML='<div style=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;\'>🏀</div>'">
      </div>
      <div class="mvp-card-name">${c.short}</div>
      <div class="mvp-card-team">${c.team}</div>
    </div>
  `).join('');

  const html = `
    <div class="mvp-overlay" id="mvp-overlay" onclick="handleMvpOverlayClick(event)">
      <div class="mvp-sheet" onclick="event.stopPropagation()">
        <div class="mvp-sheet-handle"></div>

        <div class="mvp-grid" id="mvp-grid">${candidatesHTML}</div>
        <div class="mvp-other-box ${!isCandidate&&existingName?'active':''}" id="mvp-other-box">
          <div style="font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.06em">Autre joueur</div>
          <input id="mvp-other-input" type="text" placeholder="Nom du joueur..."
            value="${!isCandidate?existingName:''}"
            oninput="onMvpOtherInput(this.value)"
            style="margin-bottom:8px">

}

function closeMvpPicker() {
  mvpPickerState.open = false;
  const el = document.getElementById('mvp-overlay');
  if (el) el.remove();
}

// FIX 1 & 3: clic joueur = sélection + sauvegarde immédiate, sans recréer le DOM
async function pickMvpDirect(e, round, name, espnId) {
  e.stopPropagation();
  // Highlight sélectionné en DOM pur, sans re-render
  document.querySelectorAll('#mvp-grid .mvp-card').forEach(el => el.classList.remove('selected'));
  document.getElementById('mvpc-' + espnId)?.classList.add('selected');
  // Désactiver "Autre"
  document.getElementById('mvp-other-box')?.classList.remove('active');
  document.getElementById('mvp-other-input') && (document.getElementById('mvp-other-input').value = '');
  // Sauvegarder directement
  closeMvpPicker();
  await saveMvpPrediction(round, name);
}

// FIX 2: oninput ne recrée jamais le DOM
function onMvpOtherInput(val) {
  const box = document.getElementById('mvp-other-box');
  if (box) box.classList.toggle('active', val.length > 0);
  // Désélectionner les cartes joueurs
  if (val.length > 0) {
    document.querySelectorAll('#mvp-grid .mvp-card').forEach(el => el.classList.remove('selected'));
  }
}

async function confirmMvpOther(round) {
  const val = document.getElementById('mvp-other-input')?.value.trim();
  if (!val) return toast('Entre un nom de joueur !');
  closeMvpPicker();
  await saveMvpPrediction(round, val);
}

function handleMvpOverlayClick(e) {
  if (e.target.id === 'mvp-overlay') closeMvpPicker();
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

async function togglePushFromHeader() {

    toast('🔕 Notifications bloquées — autorise-les dans les paramètres du navigateur');
  } else {
    await registerPushNotifications();
  }
  updateHeaderPushBtn();
}

async function updateHeaderPushBtn() {
  const status = await getPushStatus();
  if (status === state.pushStatus) return; // rien n'a changé, pas de flash
  state.pushStatus = status;
  // Patch direct du DOM sans re-render complet
  const icon = document.getElementById('header-push-icon');
  if (!icon) return;
  if (status === 'on') {
    icon.textContent = '🔔';
    icon.style.opacity = '1';
  } else if (status === 'denied') {
    icon.textContent = '🔕';
    icon.style.opacity = '0.4';
  } else {
    icon.textContent = '🔕';
    icon.style.opacity = '0.6';
  }
}

async function showPushBanner() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if (!state.currentPlayer) return;
  // Ne pas montrer si déjà abonné
  try {
    const reg = await navigator.serviceWorker.register(SW_URL);
    await navigator.serviceWorker.ready;
    const existing = await reg.pushManager.getSubscription();
    if (existing) { await _savePushSub(existing); return; }
  } catch(e) { return; }
  // Ne pas montrer si permission déjà refusée
  if (Notification.permission === 'denied') return;
  // Ne pas montrer si déjà vue et ignorée récemment (7 jours)
  const lastDismiss = localStorage.getItem('nba26_push_dismissed');
  if (lastDismiss && Date.now() - Number(lastDismiss) < 1 * 24 * 3600 * 1000) return;
  // Afficher la bannière
  const existing_banner = document.getElementById('push-banner');
  if (existing_banner) return;
  const banner = document.createElement('div');
  banner.id = 'push-banner';
  banner.innerHTML = `
    <div id="push-banner-icon">🔔</div>
    <div id="push-banner-text">
      Reçois les résultats en temps réel
      <div id="push-banner-sub">Rappels avant les matchs & résultats de séries</div>
    </div>
    <button id="push-banner-btn" onclick="activatePushFromBanner()">Activer</button>
    <button id="push-banner-close" onclick="dismissPushBanner()">✕</button>
  `;
  document.body.appendChild(banner);
}

function dismissPushBanner() {
  document.getElementById('push-banner')?.remove();
  localStorage.setItem('nba26_push_dismissed', Date.now().toString());
}

async function activatePushFromBanner() {
  document.getElementById('push-banner')?.remove();
  await registerPushNotifications();
}

async function registerPushNotifications() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  if (!state.currentPlayer) return;

  try {
    const reg = await navigator.serviceWorker.register(SW_URL);
    await navigator.serviceWorker.ready;

    const existing = await reg.pushManager.getSubscription();
    if (existing) {
      await _savePushSub(existing);
      await updateHeaderPushBtn();
      return;
    }

    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      await updateHeaderPushBtn();
      return;
    }

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });

    await _savePushSub(sub);
    await updateHeaderPushBtn();
    toast('🔔 Notifications activées !');
    loadPushSubsList();
  } catch (e) {
    console.warn('Push registration failed:', e);
  }
}

async function _savePushSub(sub) {
  if (!state.currentPlayer) return;
  const subJson = sub.toJSON();
  const endpoint = subJson.endpoint;
  // Vérifier si cette subscription existe déjà pour ce joueur
  const { data: existing } = await sb
    .from('push_subscriptions')
    .select('id')
    .eq('player_id', state.currentPlayer.id)
    .eq('subscription->>endpoint', endpoint)
    .maybeSingle();
  if (existing) {
    // Mettre à jour les clés (peuvent changer)
    await sb.from('push_subscriptions')
      .update({ subscription: subJson })
      .eq('id', existing.id);
  } else {
    await sb.from('push_subscriptions').insert({
      player_id: state.currentPlayer.id,
      subscription: subJson,
    });
  }
}

async function unregisterPushNotifications() {
  if (!('serviceWorker' in navigator)) return;
  const reg = await navigator.serviceWorker.getRegistration(SW_URL);
  if (!reg) return;
  const sub = await reg.pushManager.getSubscription();
  if (sub) {
    // Supprimer de Supabase
    await sb.from('push_subscriptions')
      .delete()
      .eq('player_id', state.currentPlayer?.id)
      .eq('subscription->>endpoint', sub.endpoint);
    await sub.unsubscribe();
  }
  _updatePushBtn();
  toast('🔕 Notifications désactivées');
  loadPushSubsList(); // Rafraîchit la liste admin en temps réel
}

async function getPushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  const perm = Notification.permission;
  if (perm === 'denied') return 'denied';
  const reg = await navigator.serviceWorker.getRegistration(SW_URL);
  if (!reg) return 'off';
  const sub = await reg.pushManager.getSubscription();
  return sub ? 'on' : 'off';
}

async function _updatePushBtn() {
  const btn = document.getElementById('push-toggle-btn');
  if (!btn) return;
  const status = await getPushStatus();
  if (status === 'unsupported') {
    btn.style.display = 'none'; return;
  }
  if (status === 'denied') {
    btn.textContent = '🔕 Notifications bloquées';
    btn.style.opacity = '0.5';
    btn.onclick = () => toast('Autorise les notifications dans les paramètres de ton navigateur');
    return;
  }
  if (status === 'on') {
    btn.textContent = '🔔 Notifications activées';
    btn.style.color = 'var(--green)';
    btn.onclick = unregisterPushNotifications;
  } else {
    btn.textContent = '🔕 Activer les notifications';
    btn.style.color = 'var(--muted)';
    btn.onclick = registerPushNotifications;
  }
}

function espnAbbrev(teamName) {
  return ESPN_ABBREV[(teamName||'').toLowerCase().trim()] || null;
}

async function findEspnEventsForSeries(seriesId, team1, team2, seriesStartTime) {
  if (_espnSeriesCache[seriesId]) return _espnSeriesCache[seriesId];

  if (!seriesStartTime) return [];

  const abbr1 = espnAbbrev(team1);
  const abbr2 = espnAbbrev(team2);
  if (!abbr1 || !abbr2) return [];

  const finishedGames = (state.games[seriesId] || []).filter(g => g.status === 'finished');
  if (!finishedGames.length) return [];

  const startD = new Date(seriesStartTime);
  const endD = new Date(startD.getTime() + 42 * 86400000);

  const fmt = d => d.getFullYear().toString()
    + String(d.getMonth()+1).padStart(2,'0')
    + String(d.getDate()).padStart(2,'0');

  const matched = [];
  const seen = new Set();

  // ESPN accepte une plage de dates : dates=YYYYMMDD-YYYYMMDD (max ~20 jours par requête)
  // On découpe en tranches de 14 jours pour rester dans les limites
  const chunkDays = 14;
  const cursor = new Date(startD);
  cursor.setDate(cursor.getDate() - 1); // J-1 pour absorber les décalages TZ

  while (cursor < endD) {
    const from = new Date(cursor);
    const to = new Date(Math.min(cursor.getTime() + chunkDays * 86400000, endD.getTime()));
    const rangeStr = `${fmt(from)}-${fmt(to)}`;

    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${rangeStr}&limit=100`);
      if (res.ok) {
        const data = await res.json();
        const allAbbrs = new Set();
        for (const ev of (data.events || [])) {
          if (seen.has(ev.id)) continue;
          const comp = ev.competitions?.[0];
          if (!comp) continue;
          const abbrs = (comp.competitors || []).map(c => (c.team?.abbreviation || '').toUpperCase());
          abbrs.forEach(a => allAbbrs.add(a));
          if (abbrs.includes(abbr1.toUpperCase()) && abbrs.includes(abbr2.toUpperCase())) {
            const evDate = ev.date ? new Date(ev.date) : null;
            if (evDate) {
              seen.add(ev.id);
              matched.push({ date: evDate, espnId: ev.id });
            }
          }
        }
        // Log de debug : affiche les abbréviations trouvées si aucun match matché
        if (!matched.length) {
          _autoSyncLog.push({ ok:false, warn:true, msg:`⚠ ${team1} vs ${team2} — ESPN plage ${rangeStr} : ${data.events?.length||0} matchs NBA, abréviations : ${[...allAbbrs].join(', ')||'aucune'} (cherche ${abbr1} et ${abbr2})` });
        }
      }
    } catch(e) {
      _autoSyncLog.push({ ok:false, warn:false, msg:`✗ ${team1} vs ${team2} — Erreur fetch ESPN plage ${rangeStr} : ${e.message}` });
    }

    cursor.setUTCDate(cursor.getUTCDate() + chunkDays + 1);
  }

  matched.sort((a,b) => a.date - b.date);
  const sortedGames = [...finishedGames].sort((a,b) => a.game_number - b.game_number);

  const result = sortedGames.map((g, i) => ({
    gameNumber: g.game_number,
    espnId: matched[i]?.espnId || null,
  })).filter(x => x.espnId);

  _espnSeriesCache[seriesId] = result;
  return result;
}

/**
 * Variante pour le sync auto : cherche tous les matchs ESPN de la série
 * (passés et jusqu'à aujourd'hui), sans se limiter aux finishedGames déjà enregistrés.
 * Associe les espnIds aux game_number de tous les matchs de la série dans l'ordre.
 */
async function findEspnEventsForSeriesSync(seriesId, team1, team2, seriesStartTime) {
  if (!seriesStartTime) return [];

  const abbr1 = espnAbbrev(team1);
  const abbr2 = espnAbbrev(team2);
  if (!abbr1 || !abbr2) return [];

  const allGames = (state.games[seriesId] || []).sort((a, b) => a.game_number - b.game_number);
  if (!allGames.length) return [];

  const startD = new Date(seriesStartTime);
  // On cherche jusqu'à aujourd'hui (pas besoin d'aller plus loin)
  const endD = new Date(Math.min(Date.now(), startD.getTime() + 42 * 86400000));

  // Toujours utiliser UTC pour le formatage — évite les décalages de fuseau horaire
  // qui feraient chercher un jour trop tôt (ex: 00h00 CEST = 22h00 UTC la veille)
  const fmt = d => d.getUTCFullYear().toString()
    + String(d.getUTCMonth()+1).padStart(2,'0')
    + String(d.getUTCDate()).padStart(2,'0');

  const matched = [];
  const seen = new Set();

  const chunkDays = 14;
  const cursor = new Date(startD);
  // Reculer de 2 jours pour absorber tout décalage UTC/local
  cursor.setUTCDate(cursor.getUTCDate() - 2);

  while (cursor <= endD) {
    const from = new Date(cursor);
    const to = new Date(Math.min(cursor.getTime() + chunkDays * 86400000, endD.getTime()));
    const rangeStr = `${fmt(from)}-${fmt(to)}`;

    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${rangeStr}&limit=100`);
      if (res.ok) {
        const data = await res.json();
        const allAbbrs = new Set();
        for (const ev of (data.events || [])) {
          if (seen.has(ev.id)) continue;
          const comp = ev.competitions?.[0];
          if (!comp) continue;
          const abbrs = (comp.competitors || []).map(c => (c.team?.abbreviation || '').toUpperCase());
          abbrs.forEach(a => allAbbrs.add(a));
          if (abbrs.includes(abbr1.toUpperCase()) && abbrs.includes(abbr2.toUpperCase())) {
            const evDate = ev.date ? new Date(ev.date) : null;
            if (evDate) {
              seen.add(ev.id);
              matched.push({ date: evDate, espnId: ev.id });
            }
          }
        }
        // Log de debug : affiche les abbréviations trouvées si aucun match matché
        if (!matched.length) {
          _autoSyncLog.push({ ok:false, warn:true, msg:`⚠ ${team1} vs ${team2} — ESPN plage ${rangeStr} : ${data.events?.length||0} matchs NBA, abréviations : ${[...allAbbrs].join(', ')||'aucune'} (cherche ${abbr1} et ${abbr2})` });
        }
      }
    } catch(e) {
      _autoSyncLog.push({ ok:false, warn:false, msg:`✗ ${team1} vs ${team2} — Erreur fetch ESPN plage ${rangeStr} : ${e.message}` });
    }

    cursor.setUTCDate(cursor.getUTCDate() + chunkDays + 1);
  }

  matched.sort((a, b) => a.date - b.date);

  // Associer chaque match ESPN (dans l'ordre chronologique) au game_number correspondant
  return allGames.map((g, i) => ({
    gameNumber: g.game_number,
    espnId: matched[i]?.espnId || null,
  })).filter(x => x.espnId);
}

async function findEspnEventId(gameId, team1, team2, startTime) {
  // Legacy – not used for series navigation, kept for compatibility
  if (!startTime) return null;
  const abbr1 = espnAbbrev(team1);
  const abbr2 = espnAbbrev(team2);
  const d = new Date(startTime);
  const dateStr = d.getFullYear().toString()
    + String(d.getMonth()+1).padStart(2,'0')
    + String(d.getDate()).padStart(2,'0');
  const dates = [dateStr];
  const dMinus = new Date(d); dMinus.setDate(dMinus.getDate()-1);
  const dPlus  = new Date(d); dPlus.setDate(dPlus.getDate()+1);
  dates.unshift(dMinus.getFullYear().toString()+String(dMinus.getMonth()+1).padStart(2,'0')+String(dMinus.getDate()).padStart(2,'0'));
  dates.push(dPlus.getFullYear().toString()+String(dPlus.getMonth()+1).padStart(2,'0')+String(dPlus.getDate()).padStart(2,'0'));
  for (const dt of dates) {
    try {
      const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard?dates=${dt}&limit=50`);
      if (!res.ok) continue;
      const data = await res.json();
      const events = data.events || [];
      for (const ev of events) {
        const comp = ev.competitions?.[0];
        if (!comp) continue;
        const competitors = comp.competitors || [];
        const abbrs = competitors.map(c => (c.team?.abbreviation||'').toUpperCase());
        const matched = abbr1 && abbr2
          ? (abbrs.includes(abbr1.toUpperCase()) && abbrs.includes(abbr2.toUpperCase()))
          : abbrs.some(a => a === (abbr1||'').toUpperCase() || a === (abbr2||'').toUpperCase());
        if (matched) return ev.id;
      }
    } catch(e) { /* continue */ }
  }
  return null;
}

async function fetchEspnStats(espnEventId) {
  if (_espnStatsCache[espnEventId]) return _espnStatsCache[espnEventId];
  const res = await fetch(`https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${espnEventId}`);
  if (!res.ok) throw new Error('ESPN indisponible');
  const data = await res.json();
  const parsed = parseEspnStats(data);
  _espnStatsCache[espnEventId] = parsed;
  return parsed;
}

function parseEspnStats(data) {
  const comp = data.header?.competitions?.[0] || data.boxscore?.teams?.[0] && data;
  const boxscore = data.boxscore || {};
  const teams = boxscore.teams || [];

  // Score + quart-temps
  const headerComp = data.header?.competitions?.[0];
  const homeTeam = headerComp?.competitors?.find(c => c.homeAway === 'home');
  const awayTeam = headerComp?.competitors?.find(c => c.homeAway === 'away');

  const homeName = homeTeam?.team?.shortDisplayName || homeTeam?.team?.displayName || '?';
  const awayName = awayTeam?.team?.shortDisplayName || awayTeam?.team?.displayName || '?';
  const homeScore = homeTeam?.score || '—';
  const awayScore = awayTeam?.score || '—';

  // Linescores (quarts)
  const homeLinescores = homeTeam?.linescores?.map(l => l.displayValue) || [];
  const awayLinescores = awayTeam?.linescores?.map(l => l.displayValue) || [];

  // Leaders
  const leaders = [];
  (data.leaders || []).forEach(cat => {
    const leader = cat.leaders?.[0];
    if (!leader) return;
    leaders.push({
      category: cat.shortDisplayName || cat.displayName || '',
      value: leader.displayValue || '',
      name: leader.athlete?.shortName || leader.athlete?.displayName || '?',
      team: leader.team?.abbreviation || '',
    });
  });

  // Boxscore joueurs
  const teamBoxes = teams.map(t => {
    const teamName = t.team?.shortDisplayName || t.team?.displayName || '?';
    const stats = t.statistics || [];
    const athletes = boxscore.players?.find(p => p.team?.id === t.team?.id)?.statistics?.[0];
    const playerRows = (athletes?.athletes || []).map(a => {
      const vals = a.stats || [];
      const labels = athletes.labels || [];
      const stat = (key) => {
        const i = labels.indexOf(key);
        return i >= 0 ? (vals[i] || '0') : '—';
      };
      return {
        name: a.athlete?.shortName || a.athlete?.displayName || '?',
        min: stat('MIN'),
        pts: stat('PTS'),
        reb: stat('REB'),
        ast: stat('AST'),
        stl: stat('STL'),
        blk: stat('BLK'),
        fg: stat('FG'),
        tp: stat('3PT'),
        ft: stat('FT'),
        to: stat('TO'),
      };
    }).filter(p => p.min !== '0:00' && p.min !== '0' && p.min !== '—');
    return { teamName, players: playerRows };
  });

  return { homeName, awayName, homeScore, awayScore, homeLinescores, awayLinescores, leaders, teamBoxes };
}

async function openSeriesStats(seriesId, team1, team2) {
  const existing = document.getElementById('stats-overlay');
  if (existing) existing.remove();

  const s = state.series.find(x => x.id === seriesId);
  const finishedGames = (state.games[seriesId] || []).filter(g => g.status === 'finished').sort((a,b) => a.game_number - b.game_number);
  if (!finishedGames.length) return toast('Aucun match joué dans cette série');

  // Crée la modale avec loader
  const overlay = document.createElement('div');
  overlay.className = 'stats-overlay';
  overlay.id = 'stats-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="stats-sheet" onclick="event.stopPropagation()">
      <div class="stats-handle"></div>
      <div class="stats-header">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;text-transform:uppercase">
              ${team1} vs ${team2}
            </div>
            <div style="font-size:11px;color:var(--muted);margin-top:2px">Stats ESPN</div>
          </div>
          <button class="btn btn-sm btn-ghost" onclick="document.getElementById('stats-overlay').remove()">✕</button>
        </div>
      </div>
      <div class="stats-body">
        <div class="stats-loading">
          <div class="spinner" style="margin:0 auto 14px"></div>
          Recherche des matchs ESPN…
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  try {
    const gameList = await findEspnEventsForSeries(seriesId, team1, team2, s?.start_time);

    if (!gameList.length) {
      document.querySelector('#stats-overlay .stats-body').innerHTML =
        `<div class="stats-error">😕 Matchs introuvables sur ESPN.<br><span style="font-size:11px">Vérifiez que la date de début de série est renseignée.</span></div>`;
      return;
    }

    // On garde l'index du match courant dans la modale
    overlay._currentIndex = 0;
    overlay._gameList = gameList;
    overlay._team1 = team1;
    overlay._team2 = team2;

    await loadSeriesStatsPage(0);
  } catch(e) {
    const body = document.querySelector('#stats-overlay .stats-body');
    if (body) body.innerHTML = `<div class="stats-error">❌ Impossible de charger les stats.<br><span style="font-size:11px">${e.message}</span></div>`;
  }
}

async function loadSeriesStatsPage(index) {
  const overlay = document.getElementById('stats-overlay');
  if (!overlay) return;
  const gameList = overlay._gameList;
  const team1 = overlay._team1;
  const team2 = overlay._team2;
  const entry = gameList[index];
  if (!entry) return;

  overlay._currentIndex = index;
  const total = gameList.length;
  const gameNumber = entry.gameNumber;

  // Affiche loader dans le body
  const sheet = overlay.querySelector('.stats-sheet');
  const bodyEl = sheet.querySelector('.stats-body');
  bodyEl.innerHTML = `<div class="stats-loading"><div class="spinner" style="margin:0 auto 14px"></div>Chargement du match ${gameNumber}…</div>`;

  try {
    const stats = await fetchEspnStats(entry.espnId);
    renderSeriesStatsInModal(stats, team1, team2, gameNumber, entry.espnId, index, total);
  } catch(e) {
    bodyEl.innerHTML = `<div class="stats-error">❌ Impossible de charger les stats.<br><span style="font-size:11px">${e.message}</span></div>`;
  }
}

function renderSeriesStatsInModal(stats, team1, team2, gameNumber, espnId, currentIndex, total) {
  const overlay = document.getElementById('stats-overlay');
  if (!overlay) return;
  const sheet = overlay.querySelector('.stats-sheet');

  const qLabels = ['Q1','Q2','Q3','Q4','OT'];
  const homeQ = stats.homeLinescores.map((v,i) => `<span class="stats-q">${qLabels[i]||'OT'} <strong style="color:var(--text)">${v}</strong></span>`).join('');
  const awayQ = stats.awayLinescores.map((v,i) => `<span class="stats-q">${qLabels[i]||'OT'} <strong style="color:var(--text)">${v}</strong></span>`).join('');

  const homeWon = Number(stats.homeScore) > Number(stats.awayScore);
  const awayWon = Number(stats.awayScore) > Number(stats.homeScore);

  const topLeaders = stats.leaders.filter(l => {
    const cat = (l.category || '').toUpperCase();
    return ['PTS','REB','AST'].includes(cat) || ['Points','Rebonds','Passes'].some(x => (l.category||'').includes(x));
  }).slice(0,3);
  const leadersHTML = topLeaders.length ? `
    <div class="stats-section-title">Leaders</div>
    <div class="stats-leaders">
      ${topLeaders.map(l => `
        <div class="stats-leader-card">
          <div class="stats-leader-cat">${l.category}</div>
          <div class="stats-leader-val">${l.value.split(' ')[0]}</div>
          <div class="stats-leader-name">${l.name}</div>
          <div class="stats-leader-team">${l.team}</div>
        </div>`).join('')}
    </div>` : '';

  const boxHTML = stats.teamBoxes.map(tb => {
    if (!tb.players.length) return '';
    const maxPts = Math.max(...tb.players.map(p => Number(p.pts)||0));
    return `
      <div class="stats-box-team">${tb.teamName}</div>
      <table class="stats-box-table">
        <thead><tr>
          <th style="text-align:left">Joueur</th>
          <th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>STL</th><th>BLK</th><th>TO</th>
        </tr></thead>
        <tbody>
          ${tb.players.map(p => `
            <tr class="${(Number(p.pts)||0) === maxPts && maxPts > 0 ? 'top-scorer' : ''}">
              <td>${p.name}</td>
              <td>${p.min}</td>
              <td style="color:${(Number(p.pts)||0)===maxPts&&maxPts>0?'var(--gold)':'inherit'};font-weight:${(Number(p.pts)||0)===maxPts&&maxPts>0?'800':'400'}">${p.pts}</td>
              <td>${p.reb}</td><td>${p.ast}</td><td>${p.stl}</td><td>${p.blk}</td><td>${p.to}</td>
            </tr>`).join('')}
        </tbody>
      </table>`;
  }).join('');

  // Navigation dots
  const dotsHTML = total > 1 ? `
    <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px">
      ${Array.from({length:total},(_,i) => `
        <button onclick="loadSeriesStatsPage(${i})"
          style="width:${i===currentIndex?'24':'8'}px;height:8px;border-radius:999px;border:none;cursor:pointer;
                 transition:all .25s;background:${i===currentIndex?'var(--accent)':'rgba(255,255,255,0.2)'}">
        </button>`).join('')}
    </div>` : '';

  // Nav prev/next
  const navHTML = total > 1 ? `
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn btn-sm${currentIndex===0?' btn-ghost':''}" style="flex:1"
        onclick="loadSeriesStatsPage(${currentIndex-1})"
        ${currentIndex===0?'disabled':''}>← Match ${currentIndex > 0 ? overlay._gameList[currentIndex-1].gameNumber : ''}</button>
      <button class="btn btn-sm${currentIndex===total-1?' btn-ghost':''}" style="flex:1"
        onclick="loadSeriesStatsPage(${currentIndex+1})"
        ${currentIndex===total-1?'disabled':''}>Match ${currentIndex < total-1 ? overlay._gameList[currentIndex+1].gameNumber : ''} →</button>
    </div>` : '';

  sheet.innerHTML = `
    <div class="stats-handle"></div>
    <div class="stats-header">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:900;text-transform:uppercase">
            ${team1} vs ${team2}
          </div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">Match ${gameNumber} · Stats ESPN</div>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="document.getElementById('stats-overlay').remove()">✕</button>
      </div>
    </div>
    <div class="stats-body" id="stats-body-swipe">
      ${navHTML}
      <div class="stats-score-block">
        <div class="stats-team-score">
          <div class="stats-team-name">${stats.awayName}</div>
          <div class="stats-team-pts" style="color:${awayWon?'var(--green)':'var(--text)'}">${stats.awayScore}</div>
          <div class="stats-quarters">${awayQ}</div>
        </div>
        <div class="stats-sep">–</div>
        <div class="stats-team-score">
          <div class="stats-team-name">${stats.homeName}</div>
          <div class="stats-team-pts" style="color:${homeWon?'var(--green)':'var(--text)'}">${stats.homeScore}</div>
          <div class="stats-quarters">${homeQ}</div>
        </div>
      </div>
      ${leadersHTML}
      ${boxHTML ? `<div class="stats-section-title">Boxscore</div>${boxHTML}` : ''}
      <div style="text-align:center;margin-top:12px">
        <a href="https://www.espn.com/nba/game/_/gameId/${espnId}" target="_blank"
           style="font-size:11px;color:var(--muted);text-decoration:none">
          Voir sur ESPN →
        </a>
      </div>
      ${dotsHTML}
    </div>`;

  // Swipe tactile gauche/droite
  const bodyEl = sheet.querySelector('#stats-body-swipe');
  if (bodyEl && total > 1) {
    let touchStartX = null;
    bodyEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
    bodyEl.addEventListener('touchend', e => {
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if (Math.abs(dx) < 40) return; // trop petit, on ignore
      const overlay = document.getElementById('stats-overlay');
      if (!overlay) return;
      const idx = overlay._currentIndex;
      if (dx < 0 && idx < total - 1) loadSeriesStatsPage(idx + 1); // swipe gauche → suivant
      if (dx > 0 && idx > 0)         loadSeriesStatsPage(idx - 1); // swipe droite → précédent
    }, { passive: true });
  }
}

async function openGameStats(gameId, team1, team2, gameNumber) {
  // Legacy: cherche la série parente et délègue à openSeriesStats
  const seriesId = Object.keys(state.games).find(sid =>
    (state.games[sid]||[]).some(g => g.id === gameId)
  );
  if (seriesId) {
    await openSeriesStats(seriesId, team1, team2);
    // Après chargement, on navigue vers le bon match
    const overlay = document.getElementById('stats-overlay');
    if (overlay?._gameList) {
      const idx = overlay._gameList.findIndex(x => x.gameNumber === gameNumber);
      if (idx >= 0 && idx !== overlay._currentIndex) await loadSeriesStatsPage(idx);
    }
    return;
  }
  toast('Série introuvable');
}

// ══════════════════════════════════════════════════
// LEADERBOARD SNAPSHOT (dynamique post-sync)
// ══════════════════════════════════════════════════

const LB_SNAPSHOT_KEY = 'nba26_lb_snapshot';

/**
 * Sauvegarde le classement actuel en localStorage (appelé après chaque sync).
 * Format : { [playerId]: rank }
 */
function _saveLeaderboardSnapshot() {
  try {
    const ranks = {};
    state.leaderboard.forEach((p, i) => { ranks[p.id] = i + 1; });
    localStorage.setItem(LB_SNAPSHOT_KEY, JSON.stringify({ ranks, ts: Date.now() }));
  } catch(e) {}
}

/**
 * Lit le snapshot sauvegardé.
 * Retourne { ranks: {playerId: rank}, ts } ou null.
 */
function _loadLeaderboardSnapshot() {
  try {
    const raw = localStorage.getItem(LB_SNAPSHOT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

/**
 * Retourne l'indicateur de tendance pour un joueur donné.
 * ↑ vert si monté, ↓ rouge si descendu, = gris si stable.
 */
function _trendArrow(playerId, currentRank) {
  const snap = _loadLeaderboardSnapshot();
  if (!snap || !snap.ranks) return '';
  const prevRank = snap.ranks[playerId];
  if (prevRank === undefined) return '';
  const diff = prevRank - currentRank; // positif = monté
  if (diff > 0) return `<span style="font-size:13px;color:var(--green);font-weight:800;margin-left:4px" title="Monté de ${diff} place(s) depuis le dernier sync">↑</span>`;
  if (diff < 0) return `<span style="font-size:13px;color:var(--red);font-weight:800;margin-left:4px" title="Descendu de ${Math.abs(diff)} place(s) depuis le dernier sync">↓</span>`;
  return `<span style="font-size:13px;color:var(--muted);font-weight:700;margin-left:4px" title="Stable depuis le dernier sync">=</span>`;
}

// ══════════════════════════════════════════════════
// AUTO-SYNC RÉSULTATS ESPN (12h45 lock anti-spoiler)
// ══════════════════════════════════════════════════

/**
 * Vérifie s'il est 12h45 ou plus en heure locale.
 */
function isAfterResultsTime() {
  const now = new Date();
  return now.getHours() > 12 || (now.getHours() === 12 && now.getMinutes() >= 45);
}

/**
 * Interroge ESPN pour un espnId donné et retourne le vainqueur (team1 ou team2)
 * si le match est officiellement terminé, sinon null.
 */
async function fetchEspnGameWinner(espnId, team1, team2) {
  try {
    const res = await fetch(`https://site.web.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=${espnId}`);
    if (!res.ok) return null;
    const data = await res.json();

    const headerComp = data.header?.competitions?.[0];
    if (!headerComp) return null;

    // Match terminé ?
    const completed = headerComp.status?.type?.completed === true
      || ['STATUS_FINAL', 'final'].includes(headerComp.status?.type?.name || '');
    if (!completed) return null;

    const homeTeam = headerComp.competitors?.find(c => c.homeAway === 'home');
    const awayTeam = headerComp.competitors?.find(c => c.homeAway === 'away');
    if (!homeTeam || !awayTeam) return null;

    const homeScore = Number(homeTeam.score || 0);
    const awayScore = Number(awayTeam.score || 0);
    if (homeScore === 0 && awayScore === 0) return null;

    // Identifier le vainqueur ESPN par son abréviation
    const winnerIsHome = homeScore > awayScore;
    const winnerAbbr = ((winnerIsHome ? homeTeam : awayTeam).team?.abbreviation || '').toUpperCase();

    // Faire correspondre avec team1 ou team2 via ESPN_ABBREV
    const abbr1 = (espnAbbrev(team1) || '').toUpperCase();
    const abbr2 = (espnAbbrev(team2) || '').toUpperCase();
    if (abbr1 && winnerAbbr === abbr1) return team1;
    if (abbr2 && winnerAbbr === abbr2) return team2;

    // Fallback : correspondance par nom court ESPN
    const winnerShort = ((winnerIsHome ? homeTeam : awayTeam).team?.shortDisplayName || '').toLowerCase();
    if (winnerShort && team1.toLowerCase().includes(winnerShort)) return team1;
    if (winnerShort && team2.toLowerCase().includes(winnerShort)) return team2;

    return null;
  } catch(e) {
    return null;
  }
}

/**
 * Cœur du sync pour une série donnée.
 * Utilise findEspnEventsForSeries (qui se base sur series.start_time, pas sur les matchs)
 * pour récupérer tous les espnId des matchs joués, puis vérifie lesquels sont terminés
 * mais pas encore enregistrés dans Supabase.
 * Retourne le nombre de matchs synchronisés.
 */
async function syncSeriesResults(series, forceSync = false) {
  const tag = `${series.team1} vs ${series.team2}`;
  if (!series.start_time) { _autoSyncLog.push({ ok:false, warn:true, msg:`⚠ ${tag} — pas de date de début` }); return 0; }
  if (series.status === 'finished') return 0;

  const games = state.games[series.id] || [];
  const pendingGames = games.filter(g => g.status !== 'finished');
  if (!pendingGames.length) return 0;

  // Vider le cache ESPN pour cette série pour forcer une nouvelle recherche
  if (forceSync) delete _espnSeriesCache[series.id];

  // findEspnEventsForSeriesSync cherche TOUS les matchs ESPN entre les deux équipes
  // depuis le début de la série jusqu'à aujourd'hui, sans se limiter aux finishedGames
  const espnEvents = await findEspnEventsForSeriesSync(series.id, series.team1, series.team2, series.start_time);
  if (!espnEvents.length) {
    _autoSyncLog.push({ ok:false, warn:true, msg:`⚠ ${tag} — aucun match trouvé sur ESPN` });
    return 0;
  }

  let syncCount = 0;

  for (const { gameNumber, espnId } of espnEvents) {
    // Trouver le match local correspondant
    const game = games.find(g => g.game_number === gameNumber);
    if (!game || game.status === 'finished') continue;

    const winner = await fetchEspnGameWinner(espnId, series.team1, series.team2);
    if (!winner) {
      _autoSyncLog.push({ ok:false, warn:true, msg:`⚠ ${tag} — Match ${gameNumber} (ESPN #${espnId}) : pas encore terminé ou vainqueur non identifié` });
      continue;
    }

    // Enregistrer dans Supabase
    const { error } = await sb.from('games').update({
      winner,
      status: 'finished'
    }).eq('id', game.id);

    if (error) {
      console.error('[AutoSync] Erreur Supabase:', error);
      _autoSyncLog.push({ ok:false, warn:false, msg:`✗ ${tag} — Match ${gameNumber} : erreur Supabase — ${error.message}` });
      continue;
    }

    syncCount++;
    _autoSyncLog.push({ ok:true, warn:false, msg:`✓ ${tag} — Match ${gameNumber} → ${winner}` });
    console.log(`[AutoSync] ✅ ${tag} — Match ${gameNumber} → ${winner}`);
  }

  if (syncCount > 0) {
    // Recharger et vérifier si la série est désormais terminée
    await loadSeries();
    const updated = state.series.find(s => s.id === series.id);
    if (updated && updated.status !== 'finished') {
      const allGames = state.games[series.id] || [];
      let w1 = 0, w2 = 0;
      allGames.filter(g => g.status === 'finished').forEach(g => {
        if (g.winner === series.team1) w1++;
        else if (g.winner === series.team2) w2++;
      });
      const seriesWinner = w1 >= 4 ? series.team1 : w2 >= 4 ? series.team2 : null;
      const seriesGamesCount = seriesWinner ? w1 + w2 : null;
      if (seriesWinner) {
        const snapshotBefore = new Set(state.series.filter(s => s.status === 'finished').map(s => s.id));
        await sb.from('series').update({
          series_winner: seriesWinner,
          series_games: seriesGamesCount,
          status: 'finished'
        }).eq('id', series.id);
        try { await sb.rpc('recalculate_points', { p_series_id: series.id }); } catch(e) {}
        await loadSeries();
        const freshSeries = state.series.find(s => s.id === series.id);
        if (freshSeries) await autoAdvanceToNextRound(freshSeries, seriesWinner);
        await loadSeries();
        await loadPredictions();
        computeLeaderboard();
        checkAndShowResultBanner(snapshotBefore);
        console.log(`[AutoSync] 🏆 Série terminée : ${seriesWinner} en ${seriesGamesCount}`);
      }
    }
  }

  return syncCount;
}

/**
 * Routine principale automatique.
 * Ne s'exécute qu'à partir de 12h45 (heure locale) — anti-spoiler.
 */
async function autoSyncGameResults() {
  if (!isAfterResultsTime()) {
    console.log('[AutoSync] Avant 12h45 — en attente');
    return;
  }

  _autoSyncLog = []; // reset log à chaque sync auto
  let totalSynced = 0;
  for (const series of state.series) {
    totalSynced += await syncSeriesResults(series);
  }

  if (totalSynced > 0) {
    computeLeaderboard();
    // Sauvegarder le snapshot de classement post-sync pour les flèches de dynamique
    _saveLeaderboardSnapshot();
    render();
    console.log(`[AutoSync] ${totalSynced} résultat(s) synchronisé(s)`);
  }

  _autoSyncLastRun = new Date();
  _autoSyncCount = totalSynced;
  _saveSyncState(_autoSyncLastRun.toISOString(), totalSynced, _autoSyncLog);
  _renderAdminSyncStatus();
}

// Persist sync state across refreshes
const _SYNC_KEY = 'nba26_last_sync';
function _saveSyncState(ts, count, log) {
  try { localStorage.setItem(_SYNC_KEY, JSON.stringify({ ts, count, log })); } catch(e) {}
}
function _loadSyncState() {
  try { return JSON.parse(localStorage.getItem(_SYNC_KEY) || 'null'); } catch(e) { return null; }
}
let _autoSyncLastRun = (() => { const s = _loadSyncState(); return s?.ts ? new Date(s.ts) : null; })();
let _autoSyncCount   = (() => { const s = _loadSyncState(); return s?.count ?? 0; })();
let _autoSyncLog     = (() => { const s = _loadSyncState(); return s?.log  ?? []; })();

function _renderAdminSyncStatus() {
  const el = document.getElementById('admin-sync-status');
  if (!el) return;
  if (!_autoSyncLastRun) {
    el.innerHTML = `<span style="color:var(--muted)">Jamais exécuté</span>`;
    return;
  }
  const t = _autoSyncLastRun.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const countHTML = _autoSyncCount > 0
    ? `<span style="color:var(--green)">✓ Dernier sync : ${t} — ${_autoSyncCount} résultat(s) enregistré(s)</span>`
    : `<span style="color:var(--muted)">Dernier sync : ${t} — aucun nouveau résultat</span>`;
  const logHTML = _autoSyncLog.length
    ? `<div style="margin-top:8px;font-size:11px;font-family:'DM Mono',monospace;background:rgba(0,0,0,0.25);border-radius:8px;padding:8px 10px;max-height:140px;overflow-y:auto;line-height:1.7">
        ${_autoSyncLog.map(l => `<div style="color:${l.ok ? 'var(--green)' : l.warn ? 'var(--amber)' : 'var(--red)'}">${l.msg}</div>`).join('')}
      </div>` : '';
  el.innerHTML = countHTML + logHTML;
}

/**
 * Lance le sync et programme la prochaine exécution à 12h46 le lendemain
 * si on est avant 12h45, ou dans 1h si on est déjà après 12h45.
 */
function scheduleAutoSync() {
  const now = new Date();

  // Calculer le prochain 12h46 : aujourd'hui si on est avant, demain sinon
  const target = new Date(now);
  target.setHours(12, 46, 0, 0);
  if (target <= now) {
    // On est déjà passé 12h46 aujourd'hui → viser demain
    target.setDate(target.getDate() + 1);
  }

  const delayMs = target - now;
  console.log(`[AutoSync] Prochain sync dans ${Math.round(delayMs/60000)} min (à 12h46)`);

  setTimeout(async () => {
    await autoSyncGameResults();
    scheduleAutoSync(); // re-programmer pour le lendemain
  }, delayMs);
}

init();
