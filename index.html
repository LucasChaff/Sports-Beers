// REALTIME
// ══════════════════════════════════════════════════
function subscribeRealtime() {
  sb.channel('db-all')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'series' }, async () => {
      if (state.loading) return;
      if (skipNextSeriesRealtime > 0) { skipNextSeriesRealtime--; return; }
      // ⚠️ Capturer le snapshot AVANT le reload — sinon la comparaison rate toujours
      const snapshotBefore = new Set(state.series.filter(s => s.status === 'finished').map(s => s.id));
      await loadSeries();
      await loadPredictions();
      computeLeaderboard();
      // Passer le snapshot "avant" pour détecter les nouvelles séries finished
      checkAndShowResultBanner(snapshotBefore);
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'games' }, async () => {
      if (state.loading) return;
      if (skipNextGamesRealtime > 0) { skipNextGamesRealtime--; return; }
      await loadSeries();
      await loadPredictions();
      computeLeaderboard();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'predictions' }, async () => {
      if (state.loading) return;
      if (skipNextPredictionRealtime > 0) { skipNextPredictionRealtime--; return; }
      await loadPredictions();
      computeLeaderboard();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, async () => {
      if (state.loading) return;
      if (skipNextPlayersRealtime > 0) { skipNextPlayersRealtime--; return; }
      await loadPlayers();
      await loadPredictions();
      computeLeaderboard();
      // Re-valider que le joueur connecté existe toujours
      if (state.currentPlayer) {
        const still = state.players.find(p => p.id === state.currentPlayer.id);
        if (!still) {
          state.currentPlayer = null;
          localStorage.removeItem('nba26_player');
          state.showOnboarding = true;
          state.onboardLogin = state.players.length > 0;
        } else {
          state.currentPlayer = still;
        }
      }
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'settings' }, async () => {
      if (state.loading) return;
      if (skipNextSettingsRealtime > 0) { skipNextSettingsRealtime--; return; }
      await loadSettings();
      computeLeaderboard();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'mvp_predictions' }, async () => {
      if (state.loading) return;
      await loadMvpPredictions();
      computeLeaderboard();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'champion_predictions' }, async () => {
      if (state.loading) return;
      await loadChampionPredictions();
      computeLeaderboard();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'double_down' }, async () => {
      if (state.loading) return;
      await loadDoubleDowns();
      computeLeaderboard();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'leagues' }, async () => {
      if (state.loading) return;
      await loadLeagues();
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'league_members' }, async () => {
      if (state.loading) return;
      await loadLeagues();
      render();
    })
    .subscribe();
}

// ══════════════════════════════════════════════════
// 1. BANNIÈRE DE RÉSULTAT — avec file d'attente et rattrapage des bannières manquées
// ══════════════════════════════════════════════════

// Clé localStorage par joueur — chaque compte a son propre historique de bannières vues
function _seenKey() {
  const pid = state.currentPlayer?.id || 'anonymous';
  return 'nba26_seen_finished_' + pid;
}
function _getSeenIds() {
  try { return new Set(JSON.parse(localStorage.getItem(_seenKey()) || '[]')); }
  catch { return new Set(); }
}
function _markSeen(id) {
  const seen = _getSeenIds();
  seen.add(id);
  localStorage.setItem(_seenKey(), JSON.stringify([...seen]));
}

// Cache pour le realtime : snapshot des finished juste avant chaque reload
let _lastFinishedSeriesIds = new Set();

// File d'attente des bannières à afficher
let _bannerQueue = [];
let _bannerRunning = false;
let _currentBannerSeriesId = null;

function _enqueueBanners(seriesList, missed = false) {
  _bannerQueue.push(...seriesList.map(s => ({ series: s, missed })));
  if (!_bannerRunning) _drainBannerQueue();
}

function _drainBannerQueue() {
  if (_bannerQueue.length === 0) { _bannerRunning = false; return; }
  _bannerRunning = true;
  const { series, missed } = _bannerQueue.shift();
  showResultBanner(series, missed);
  // Attendre 8.5s (durée auto-dismiss + marge) avant la suivante
  setTimeout(_drainBannerQueue, 4500);
}

// Appelée au boot — initialise le cache ET rejoue les bannières manquées
function initFinishedSeriesCache() {
  const seen = _getSeenIds();
  const nowFinished = state.series.filter(s => s.status === 'finished');

  // Séries finies pas encore vues = bannières manquées
  const missed = nowFinished.filter(s => !seen.has(s.id));

  // Initialise le cache realtime avec l'état actuel
  _lastFinishedSeriesIds = new Set(nowFinished.map(s => s.id));

  if (missed.length > 0) {
    // Petit délai pour laisser l'UI se rendre d'abord
    setTimeout(() => _enqueueBanners(missed, true), 800);
  }
}

// Appelée à chaque event realtime sur la table series
function checkAndShowResultBanner(snapshotBefore) {
  // Utilise le snapshot passé en paramètre (capturé avant loadSeries)
  // ou le cache interne si appelé sans argument
  const ref = snapshotBefore || _lastFinishedSeriesIds;
  const nowFinished = state.series.filter(s => s.status === 'finished');
  const newlyFinished = nowFinished.filter(s => !ref.has(s.id));
  // Met à jour le cache interne
  _lastFinishedSeriesIds = new Set(nowFinished.map(s => s.id));
  if (newlyFinished.length > 0) _enqueueBanners(newlyFinished, false);
}

function showResultBanner(series, missed = false) {
  // Calcule les points gagnés par chaque joueur sur cette série
  const ap = state.predictions.filter(p => p.series_id === series.id);
  const roundPts = getRoundPoints(series.round);

  const rows = ap.map(pred => {
    const pl = getPlayer(pred.player_id);
    if (!pl) return null;
    const winOk = pred.predicted_series_winner === series.series_winner;
    const exactOk = winOk && Number(pred.predicted_series_games) === Number(series.series_games);
    const sGames = state.games[series.id] || [];
    const gPreds = pred.game_predictions || [];
    let ptsSW = winOk ? roundPts.series : 0;
    let ptsSE = exactOk ? roundPts.exact : 0;
    let ptsG = 0;
    sGames.forEach(g => {
      if (g.status !== 'finished' || !g.winner) return;
      const gp = gPreds.find(x => Number(x.game_number) === Number(g.game_number));
      if (gp && gp.predicted_winner === g.winner) ptsG += roundPts.match;
    });
    const dd = state.doubleDowns.find(d => d.player_id === pred.player_id && d.series_id === series.id);
    if (dd) { ptsG *= 2; if (winOk) { ptsSW *= 2; ptsSE *= 2; } }
    const total = ptsSW + ptsSE + ptsG;
    return { pl, total, winOk, ddActive: !!dd && winOk };
  }).filter(Boolean).sort((a, b) => b.total - a.total);

  // Confettis si au moins quelqu'un a des points
  if (rows.some(r => r.total > 0)) spawnConfetti();

  const existing = document.getElementById('result-banner');
  if (existing) existing.remove();

  const rowsHTML = rows.map(r => `
    <div class="result-banner-row">
      ${avatarImg(r.pl, '22px')}
      <span style="font-weight:600">${r.pl.name}</span>
      ${r.winOk ? `<span class="badge badge-green" style="font-size:9px">✓</span>` : `<span class="badge badge-gray" style="font-size:9px">✗</span>`}
      ${r.ddActive ? `<span class="dd-badge" style="font-size:9px;padding:1px 5px">🎲</span>` : ''}
      <span class="result-banner-pts" style="color:${r.total > 0 ? (r.ddActive ? 'var(--gold)' : 'var(--green)') : 'var(--muted)'}">
        ${r.total > 0 ? '+' + r.total : '—'}
      </span>
    </div>
  `).join('');

  const logo = teamLogo(series.series_winner);
  const logoHTML = logo ? `<img src="${logo}" style="width:24px;height:24px;object-fit:contain;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))" onerror="this.style.display='none'">` : '🏆';
  const missedLabel = missed ? `<span style="font-size:10px;font-weight:600;color:var(--muted);background:rgba(255,255,255,0.07);border-radius:999px;padding:2px 8px;letter-spacing:0.06em;text-transform:uppercase;margin-left:4px">manqué</span>` : '';

  const html = `
    <div class="result-banner" id="result-banner">
      <div class="result-banner-inner" id="result-banner-inner">
        <button class="result-banner-close" onclick="dismissResultBanner()">✕</button>
        <div class="result-banner-title">
          ${logoHTML}
          ${series.series_winner} en ${series.series_games}
          ${missedLabel}
        </div>
        <div class="result-banner-scores">${rowsHTML}</div>
        <div class="result-banner-progress" id="result-banner-progress"></div>
      </div>
    </div>`;

  document.body.insertAdjacentHTML('beforeend', html);

  // Mémoriser l'id de la série affichée (sera marquée "vue" au dismiss)
  _currentBannerSeriesId = series.id;

  // Indicateur si d'autres bannières sont en file d'attente
  if (_bannerQueue.length > 0) {
    const inner = document.getElementById('result-banner-inner');
    if (inner) {
      const pill = document.createElement('div');
      pill.style.cssText = 'margin-top:8px;font-size:10px;color:var(--muted);text-align:center;letter-spacing:0.06em;text-transform:uppercase;';
      pill.textContent = `+${_bannerQueue.length} autre${_bannerQueue.length > 1 ? 's' : ''} résultat${_bannerQueue.length > 1 ? 's' : ''} manqué${_bannerQueue.length > 1 ? 's' : ''}`;
      inner.appendChild(pill);
    }
  }

  // Auto-dismiss après 8 secondes
  setTimeout(() => dismissResultBanner(), 4000);
}

function dismissResultBanner() {
  const inner = document.getElementById('result-banner-inner');
  if (!inner) return;
  // Marquer la série comme vue au moment où la bannière disparaît
  if (_currentBannerSeriesId) {
    _markSeen(_currentBannerSeriesId);
    _currentBannerSeriesId = null;
  }
  inner.classList.add('hiding');
  setTimeout(() => document.getElementById('result-banner')?.remove(), 320);
}

function spawnConfetti() {
  const colors = ['#f5c518','#e8422a','#3d7fff','#1db954','#a855f7','#f59e0b'];
  for (let i = 0; i < 28; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.style.cssText = `
        left:${10 + Math.random() * 80}vw;
        top:${Math.random() * 30}px;
        background:${colors[Math.floor(Math.random() * colors.length)]};
        width:${6 + Math.random() * 6}px;
        height:${6 + Math.random() * 6}px;
        border-radius:${Math.random() > .5 ? '50%' : '2px'};
        animation-duration:${0.9 + Math.random() * 0.8}s;
        animation-delay:${Math.random() * 0.4}s;
      `;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2000);
    }, i * 30);
  }
}

// ══════════════════════════════════════════════════
// 2. RÉCAPITULATIF DE FIN DE ROUND
// ══════════════════════════════════════════════════
function getRoundRecap(round) {
  // Tous les joueurs, points gagnés uniquement sur ce round
  const seriesOfRound = state.series.filter(s => s.round === round && s.status === 'finished');
  if (!seriesOfRound.length) return null;

  const playerPoints = {};
  state.players.forEach(p => { playerPoints[p.id] = 0; });

  seriesOfRound.forEach(s => {
    const roundPts = getRoundPoints(s.round);
    const ap = state.predictions.filter(p => p.series_id === s.id);
    ap.forEach(pred => {
      if (!playerPoints.hasOwnProperty(pred.player_id)) return;
      const winOk = pred.predicted_series_winner === s.series_winner;
      const exactOk = winOk && Number(pred.predicted_series_games) === Number(s.series_games);
      const sGames = state.games[s.id] || [];
      const gPreds = pred.game_predictions || [];
      let sw = winOk ? roundPts.series : 0;
      let se = exactOk ? roundPts.exact : 0;
      let sg = 0;
      sGames.forEach(g => {
        if (g.status !== 'finished' || !g.winner) return;
        const gp = gPreds.find(x => Number(x.game_number) === Number(g.game_number));
        if (gp && gp.predicted_winner === g.winner) sg += roundPts.match;
      });
      const dd = state.doubleDowns.find(d => d.player_id === pred.player_id && d.series_id === s.id);
      if (dd) { sg *= 2; if (winOk) { sw *= 2; se *= 2; } }
      playerPoints[pred.player_id] += sw + se + sg;
    });
  });

  return state.players
    .map(p => ({ player: p, pts: playerPoints[p.id] || 0 }))
    .sort((a, b) => b.pts - a.pts);
}

function renderRoundRecapCard(round) {
  // N'afficher que si le round est entièrement terminé
  const seriesOfRound = state.series.filter(s => s.round === round);
  if (!seriesOfRound.length) return '';
  const allDone = seriesOfRound.every(s => s.status === 'finished');
  if (!allDone) return '';

  const recap = getRoundRecap(round);
  if (!recap) return '';

  const ROUND_EMOJI = {
    'Premier tour': '🥊', 'Demi-finales': '⚡',
    'Finales de conférence': '🔥', 'Finales NBA': '👑'
  };

  const rows = recap.map((r, i) => {
    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}.`;
    return `
      <div class="round-recap-row">
        <span class="round-recap-rank">${medal}</span>
        ${avatarImg(r.player, '24px')}
        <span style="font-weight:600;font-size:13px">${r.player.name}</span>
        <span class="round-recap-pts" style="color:${r.pts > 0 ? 'var(--blue)' : 'var(--muted)'}">
          ${r.pts > 0 ? '+' + r.pts : '—'}
        </span>
      </div>`;
  }).join('');

  return `
    <div class="round-recap">
      <div class="round-recap-title">${ROUND_EMOJI[round] || '🏅'} Récap du round</div>
      <div class="round-recap-name">${round}</div>
      <div class="round-recap-rows">${rows}</div>
    </div>`;
}

// ══════════════════════════════════════════════════
// 3. COMPTE À REBOURS
// ══════════════════════════════════════════════════
function formatCountdown(targetIso) {
  const diff = new Date(targetIso) - new Date();
  if (diff <= 0) return null;
  const totalSec = Math.floor(diff / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;
  const urgent = diff < 3600000; // moins d'1h

  let label = '';
  if (days > 0) label = `${days}j ${hours}h ${mins}m`;
  else if (hours > 0) label = `${hours}h ${mins}m`;
  else if (mins > 0) label = `${mins}m ${String(secs).padStart(2,'0')}s`;
  else label = `${secs}s`;

  return { label, urgent };
}

// Met à jour tous les comptes à rebours en live sans re-render
function tickCountdowns() {
  document.querySelectorAll('[data-countdown]').forEach(el => {
    const iso = el.dataset.countdown;
    const result = formatCountdown(iso);
    if (!result) {
      el.textContent = '🔒 Verrouillé';
      el.className = 'countdown-badge urgent';
    } else {
      el.textContent = '⏳ ' + result.label;
      el.className = 'countdown-badge' + (result.urgent ? ' urgent' : '');
    }
  });
}

// Lance le ticker toutes les secondes
function startCountdownTicker() {
  setInterval(tickCountdowns, 1000);
}

function countdownBadgeHTML(startTimeIso) {
  if (!startTimeIso) return '';
  const result = formatCountdown(startTimeIso);
  if (!result) return `<span class="countdown-badge urgent">🔒 Verrouillé</span>`;
  return `<span class="countdown-badge${result.urgent ? ' urgent' : ''}" data-countdown="${startTimeIso}">⏳ ${result.label}</span>`;
}

// ══════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════
async function hashPin(pin) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pin));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function toast(msg, ms=2800) {
  const el=document.getElementById('toast');
  if(!el)return; el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),ms);
}
function avatarColor(name) {
  const c=['#e8422a','#3d7fff','#1db954','#a855f7','#f59e0b','#ef4444','#06b6d4','#ec4899'];
  let h=0; for(let ch of name) h=(h*31+ch.charCodeAt(0))%c.length; return c[h];
}
function initials(name) { return name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2); }

// Rendu avatar : photo si dispo, sinon initiales colorées
// size : taille CSS (ex: '36px'), extraStyle : styles inline supplémentaires
function avatarImg(player, size='36px', extraStyle='') {
  const s = `width:${size};height:${size};border-radius:50%;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;${extraStyle}`;
  if (player?.avatar_url) {
    return `<div style="${s}background:${player.avatar_color}22"><img src="${player.avatar_url}" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML='<span style=\'font-family:Barlow Condensed,sans-serif;font-size:calc(${size} * 0.38);font-weight:800;\'>${initials(player.name)}</span>';this.parentElement.style.background=\'${player.avatar_color}22\';this.parentElement.style.color=\'${player.avatar_color}\'"></div>`;
  }
  const fs = `calc(${size} * 0.38)`;
  return `<div style="${s}background:${player.avatar_color}22;color:${player.avatar_color};font-family:'Barlow Condensed',sans-serif;font-size:${fs};font-weight:800;">${initials(player.name)}</div>`;
}
function fmtDate(iso) {
  if(!iso) return '—';
  return new Date(iso).toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
}
function isLocked(s) {
  if(s.status==='locked'||s.status==='finished') return true;
  if(s.start_time) return new Date()>=new Date(s.start_time);
  // Auto-lock if at least one game has been played
  const seriesGames = state.games[s.id] || [];
  if(seriesGames.some(g => g.status === 'finished')) return true;
  return false;
}
function isGameLocked(g) {
  if(g.status==='locked'||g.status==='finished') return true;
  if(g.start_time) return new Date()>=new Date(g.start_time);
  return false;
}

function isEditingSeries(seriesId) {
  return !!editMode[seriesId];
}

function startEditingSeries(seriesId) {
  editMode[seriesId] = true;
  render();
}

function stopEditingSeries(seriesId) {
  delete editMode[seriesId];
}

function getPred(playerId, seriesId) { return state.predictions.find(p=>p.player_id===playerId&&p.series_id===seriesId); }
function myPred(seriesId) { return state.currentPlayer ? getPred(state.currentPlayer.id, seriesId) : null; }
function allPreds(seriesId) { return state.predictions.filter(p=>p.series_id===seriesId); }
function getPlayer(id) { return state.players.find(p=>p.id===id); }
function isLockedSeriesForMyPick(s) {
  if (s.status === 'locked' || s.status === 'finished') return true;
  if (s.start_time) return new Date() >= new Date(s.start_time);
  // Auto-lock if at least one game has been played
  const seriesGames = state.games[s.id] || [];
  if (seriesGames.some(g => g.status === 'finished')) return true;
  return false;
}

// ══════════════════════════════════════════════════
// CHAMPION PREDICTION LOGIC
// ══════════════════════════════════════════════════
function getChampionPredForRound(playerId, round) {
  return state.championPredictions.find(
    p => p.player_id === playerId && p.playoff_round === round
  );
}

function myChampionPred(round) {
  if (!state.currentPlayer) return null;
  return getChampionPredForRound(state.currentPlayer.id, round);
}

function isChampionLocked(round) {
  const seriesOfRound = state.series.filter(s => s.round === round);
  if (!seriesOfRound.length) return false;

  // Si au moins une série du round est verrouillée/terminée manuellement
  if (seriesOfRound.some(s => s.status === 'locked' || s.status === 'finished')) return true;

  // Si au moins un match du round a été validé
  const hasValidatedGame = seriesOfRound.some(s => {
    const seriesGames = state.games[s.id] || [];
    return seriesGames.some(g => g.status === 'finished');
  });
  if (hasValidatedGame) return true;

  // Verrouillage automatique à la date de début
  const earliestStart = seriesOfRound.map(s => s.start_time).filter(Boolean).sort()[0];
  if (!earliestStart) return false;
  return new Date() >= new Date(earliestStart);
}

// Get all teams still alive at a given round (appeared in that round or later)
function getTeamsForRound(round) {
  const roundOrder = ['Premier tour', 'Demi-finales', 'Finales de conférence', 'Finales NBA'];
  const idx = roundOrder.indexOf(round);
  // All teams in series from this round onwards
  const teams = new Set();
  state.series
    .filter(s => roundOrder.indexOf(s.round) >= idx)
    .forEach(s => {
      if (s.team1 && s.team1 !== 'À déterminer') teams.add(s.team1);
      if (s.team2 && s.team2 !== 'À déterminer') teams.add(s.team2);
    });
  return [...teams].sort();
}

async function saveChampionPrediction(round, predictedChampion) {
  if (!state.currentPlayer) return false;
  if (isChampionLocked(round)) {
    toast('🔒 Trop tard ! Le round a commencé.');

function isMvpLocked(round) {
  const seriesOfRound = state.series.filter(s => s.round === round);

  // Si aucune série dans ce round, pas verrouillé
  if (!seriesOfRound.length) return false;

  // Sécurité 1 : si au moins une série du round est verrouillée/terminée manuellement
  if (seriesOfRound.some(s => s.status === 'locked' || s.status === 'finished')) return true;

  // Sécurité 2 : si au moins un match du round a été validé
  const hasValidatedGame = seriesOfRound.some(s => {
    const seriesGames = state.games[s.id] || [];
    return seriesGames.some(g => g.status === 'finished');
  });
  if (hasValidatedGame) return true;

  // Sécurité 3 : verrouillage automatique à la date de début
  const earliestStart = seriesOfRound
    .map(s => s.start_time)
    .filter(Boolean)
    .sort()[0];

  if (!earliestStart) return false;

  return new Date() >= new Date(earliestStart);
}

    }
  };

  return map[round] || { match: 2, series: 3, exact: 5 };
}

async function uploadAvatar(file, playerId) {
  if (!file) return null;
  if (file.size > 3 * 1024 * 1024) { toast('❌ Image trop lourde (max 3 Mo)'); return null; }
  const ext = file.name.split('.').pop().toLowerCase();
  if (!['jpg','jpeg','png','webp','gif'].includes(ext)) { toast('❌ Format non supporté (jpg, png, webp)'); return null; }
  const path = `${playerId}/avatar.${ext}`;
  const { error } = await sb.storage.from('avatars').upload(path, file, { upsert: true });
  if (error) { console.error(error); toast('❌ Erreur upload photo : ' + error.message); return null; }
  const { data } = sb.storage.from('avatars').getPublicUrl(path);
  // Ajouter un timestamp pour forcer le rechargement de l'image (cache-bust)
  return data.publicUrl + '?t=' + Date.now();
}

// ── Map rounds to next round ──────────────────────────────────────
const ROUND_NEXT = {
  'Premier tour': 'Demi-finales',
  'Demi-finales': 'Finales de conférence',
  'Finales de conférence': 'Finales NBA',
};

// bracket_position : entier 1-30 encodant la position globale dans le bracket.
// Ouest 1er tour: 1-8 | Est 1er tour: 9-16 | Demi Ouest: 17-20 | Demi Est: 21-24
// Finale Ouest: 25-26 | Finale Est: 27-28 | Finales NBA: 29-30
// Table de routage dans ROUTING (forceAdvanceToNextRound / autoAdvanceToNextRound).

async function setSeriesResult(id, winner, games) {
  try {
    const { error: e1 } = await sb
      .from('series')
      .update({
        series_winner: winner,
        series_games: Number(games),
        status: 'finished'
      })
      .eq('id', id);

    if (e1) {
      console.error(e1);
      toast('❌ Erreur mise à jour série');
      return;
    }

    try { await sb.rpc('recalculate_points', { p_series_id: id }); } catch(e) { console.warn('RPC serie:', e); }

    // Snapshot AVANT reload pour détecter la nouvelle série finished
    const snapshotBefore = new Set(state.series.filter(s => s.status === 'finished').map(s => s.id));

    await loadSeries();
    const finishedSeries = state.series.find(s => s.id === id);
    if (finishedSeries) await autoAdvanceToNextRound(finishedSeries, winner);

    await loadSeries();
    await loadPredictions();
    computeLeaderboard();
    // Déclencher la bannière pour l'admin aussi (il ne reçoit pas son propre event realtime)
    checkAndShowResultBanner(snapshotBefore);
    // Sauter l'event realtime qui va arriver (bannière déjà affichée)
    skipNextSeriesRealtime += 1;
    render();
    toast('🏆 Résultat enregistré !');
  } catch (err) {
    console.error('setSeriesResult crash:', err);
    toast('❌ Erreur JS lors de la validation');
  }
}

async function setGameResult(gameId, seriesId, winner) {
  try {
    const { error } = await sb
      .from('games')
      .update({
        winner,
        status: 'finished'
      })
      .eq('id', gameId);

    if (error) {
      console.error(error);
      toast('❌ Erreur mise à jour match');
      return;
    }

    try { await sb.rpc('recalculate_points', { p_series_id: seriesId }); } catch(e) { console.warn('RPC match:', e); }

    await loadSeries();
    await loadPredictions();
    computeLeaderboard();

    // ── Auto-finish series if a team reaches 4 wins ──────────────
    const series = state.series.find(s => s.id === seriesId);
    if (series && series.status !== 'finished') {
      const allGames = state.games[seriesId] || [];
      const finishedGames = allGames.filter(g => g.status === 'finished');
      let wins1 = 0, wins2 = 0;
      finishedGames.forEach(g => {
        if (g.winner === series.team1) wins1++;
        else if (g.winner === series.team2) wins2++;
      });

      const winnerTeam = wins1 >= 4 ? series.team1 : wins2 >= 4 ? series.team2 : null;
      const totalGames = winnerTeam ? wins1 + wins2 : null;

      if (winnerTeam) {
        // Snapshot AVANT la mise à jour auto-finish
        const snapshotBefore = new Set(state.series.filter(s => s.status === 'finished').map(s => s.id));

        await sb.from('series').update({
          series_winner: winnerTeam,
          series_games: totalGames,
          status: 'finished'
        }).eq('id', seriesId);

        try { await sb.rpc('recalculate_points', { p_series_id: seriesId }); } catch(e) { console.warn('RPC auto-finish:', e); }

        // Reload series FIRST so autoAdvanceToNextRound reads fresh state
        await loadSeries();
        const freshSeries = state.series.find(s => s.id === seriesId);
        if (freshSeries) await autoAdvanceToNextRound(freshSeries, winnerTeam);

        await loadSeries();
        await loadPredictions();
        computeLeaderboard();
        // Bannière pour l'admin + skip l'event realtime qui arrive
        checkAndShowResultBanner(snapshotBefore);
        skipNextSeriesRealtime += 1;
        render();
        toast('🏆 ' + winnerTeam + ' remporte la série ! Passage au tour suivant.');
        return;
      }
    }

    render();
    toast('✅ Résultat du match enregistré');
  } catch (err) {
    console.error('setGameResult crash:', err);
    toast('❌ Erreur JS lors de la validation');
  }
}

async function forceAdvanceToNextRound(seriesId, winner) {
  if (!confirm(`Forcer l'avancement de ${winner} au tour suivant ?`)) return;
  await loadSeries();
  const series = state.series.find(s => s.id === seriesId);
  if (!series) return toast('❌ Série introuvable');
  if (!winner) return toast('❌ Pas de vainqueur défini');

  const nextRound = ROUND_NEXT[series.round];
  if (!nextRound) return toast('❌ Pas de tour suivant');

  const winnerSeed = getTeamSeed(winner, series, winner === series.team1 ? 1 : 2);
  const srcPos = series.bracket_position;  // position 1-30

  if (!srcPos) return toast('❌ bracket_position manquante sur cette série — mets-la à jour dans Supabase');

  // ── TABLE DE ROUTAGE 1-30 ────────────────────────────────────────
  // Chaque position source → { destPos, isTeam1 }
  // isTeam1 = true  → le vainqueur va en team1 (slot haut) de la série cible
  // isTeam1 = false → team2 (slot bas)
  // ROUTING : position 1-30 de l'équipe → { dest: position de la série cible, isTeam1 }
  // Chaque série occupe 2 positions (team1 + team2).
  // Exemple : série "Premier tour Ouest #1" = pos 1 (team1) et pos 2 (team2)
  //           son vainqueur va en pos 17 (team1 de la demi Ouest #1)
  // Séries existantes : 1-2, 3-4, 5-6, 7-8 (Ouest R1) | 9-10, 11-12, 13-14, 15-16 (Est R1)
  //                     17-18, 19-20 (Demi Ouest) | 21-22, 23-24 (Demi Est)
  //                     25-26 (Finale Ouest) | 27-28 (Finale Est) | 29-30 (Finales NBA)
  const ROUTING = {
    // R1 Ouest (slots 1,3,5,7) → SF Ouest (17,19)
    1:  { dest: 17, isTeam1: true  },
    3:  { dest: 17, isTeam1: false },
    5:  { dest: 19, isTeam1: true  },
    7:  { dest: 19, isTeam1: false },
    // R1 Est (slots 9,11,13,15) → SF Est (21,23)
    9:  { dest: 21, isTeam1: true  },
    11: { dest: 21, isTeam1: false },
    13: { dest: 23, isTeam1: true  },
    15: { dest: 23, isTeam1: false },
    // SF Ouest (17,19) → CF Ouest (25)
    17: { dest: 25, isTeam1: true  },
    19: { dest: 25, isTeam1: false },
    // SF Est (21,23) → CF Est (27)
    21: { dest: 27, isTeam1: true  },
    23: { dest: 27, isTeam1: false },
    // CF → Finales NBA (29)
    25: { dest: 29, isTeam1: true  },
    27: { dest: 29, isTeam1: false },
    // Finales NBA → champion
    29: { dest: null, isTeam1: true  },
  };

  const route = ROUTING[srcPos];
  if (!route) return toast(`❌ Position ${srcPos} non reconnue dans le bracket`);
  if (!route.dest) return toast('🏆 Cette série est déjà la finale NBA !');

  const destPos = route.dest;
  const placeAsTeam1 = route.isTeam1;

  // ── Finales NBA (dest 29 ou 30) ─────────────────────────────────
  const isNBAFinals = destPos === 29 || destPos === 30;
  if (isNBAFinals) {
    const existingFinals = state.series.find(s => s.round === 'Finales NBA');
    skipNextSeriesRealtime += 1;
    if (existingFinals) {
      const upd = placeAsTeam1
        ? { team1: winner, team1_seed: winnerSeed ?? null }
        : { team2: winner, team2_seed: winnerSeed ?? null };
      await sb.from('series').update(upd).eq('id', existingFinals.id);
    } else {
      const { data: newS } = await sb.from('series').insert({
        team1: placeAsTeam1 ? winner : 'À déterminer',
        team2: placeAsTeam1 ? 'À déterminer' : winner,
        team1_seed: placeAsTeam1 ? (winnerSeed ?? null) : null,
        team2_seed: placeAsTeam1 ? null : (winnerSeed ?? null),
        round: 'Finales NBA', conference: '—', status: 'upcoming',
        bracket_position: destPos
      }).select().single();
      if (newS) await create7Games(newS.id);
    }
    await loadSeries(); render(); toast('✅ ' + winner + ' avancé aux Finales NBA !');
    return;
  }

  // ── Chercher ou créer la série cible ────────────────────────────
  const conf = series.conference;
  const targetSeries = state.series.find(s => s.bracket_position === destPos);

  skipNextSeriesRealtime += 1;
  if (targetSeries) {
    const upd = placeAsTeam1
      ? { team1: winner, team1_seed: winnerSeed ?? null }
      : { team2: winner, team2_seed: winnerSeed ?? null };
    const { error: updErr } = await sb.from('series').update(upd).eq('id', targetSeries.id);
    if (updErr) { skipNextSeriesRealtime = Math.max(0, skipNextSeriesRealtime - 1); return toast('❌ Erreur update : ' + updErr.message); }
  } else {
    // Créer la série cible
    const payload = {
      round: nextRound, conference: conf, status: 'upcoming',
      bracket_position: destPos, start_time: null,
      team1: placeAsTeam1 ? winner : 'À déterminer',
      team2: placeAsTeam1 ? 'À déterminer' : winner,
      team1_seed: placeAsTeam1 ? (winnerSeed ?? null) : null,
      team2_seed: placeAsTeam1 ? null : (winnerSeed ?? null),
    };
    console.log('[Force] INSERT payload:', JSON.stringify(payload));
    const { data: newS, error: insErr } = await sb.from('series').insert(payload).select().single();
    if (insErr) { skipNextSeriesRealtime = Math.max(0, skipNextSeriesRealtime - 1); return toast('❌ Erreur insert : ' + insErr.message); }
    if (newS) await create7Games(newS.id);
  }

  await loadSeries(); render(); toast('✅ ' + winner + ' avancé au tour suivant !');
}

async function autoAdvanceToNextRound(series, winnerTeam) {
  const nextRound = ROUND_NEXT[series.round];
  if (!nextRound) return;

  const winnerSeed = getTeamSeed(winnerTeam, series, winnerTeam === series.team1 ? 1 : 2);
  const srcPos = series.bracket_position;

  if (!srcPos) { console.warn('[AutoAdvance] bracket_position manquante sur série', series.id); return; }

  const ROUTING = {
    // R1 Ouest (slots 1,3,5,7) → SF Ouest (17,19)
    1:  { dest: 17, isTeam1: true  },
    3:  { dest: 17, isTeam1: false },
    5:  { dest: 19, isTeam1: true  },
    7:  { dest: 19, isTeam1: false },
    // R1 Est (slots 9,11,13,15) → SF Est (21,23)
    9:  { dest: 21, isTeam1: true  },
    11: { dest: 21, isTeam1: false },
    13: { dest: 23, isTeam1: true  },
    15: { dest: 23, isTeam1: false },
    // SF Ouest (17,19) → CF Ouest (25)
    17: { dest: 25, isTeam1: true  },
    19: { dest: 25, isTeam1: false },
    // SF Est (21,23) → CF Est (27)
    21: { dest: 27, isTeam1: true  },
    23: { dest: 27, isTeam1: false },
    // CF → Finales NBA (29)
    25: { dest: 29, isTeam1: true  },
    27: { dest: 29, isTeam1: false },
  };

  const route = ROUTING[srcPos];
  if (!route || !route.dest) return;

  const destPos = route.dest;
  const placeAsTeam1 = route.isTeam1;
  const isNBAFinals = destPos === 29 || destPos === 30;
  const conf = isNBAFinals ? '—' : series.conference;

  // 1. Cherche par bracket_position exacte
  let targetSeries = state.series.find(s => s.bracket_position === destPos);

  // 2. Fallback : cherche une série "À déterminer" du bon round+conférence
  //    (cas des séries créées manuellement sans bracket_position)
  if (!targetSeries) {
    const tbdCandidates = state.series.filter(s =>
      s.round === nextRound &&
      s.conference === conf &&
      s.bracket_position == null &&
      (s.team1 === 'À déterminer' || s.team2 === 'À déterminer')
    );
    if (tbdCandidates.length === 1) {
      targetSeries = tbdCandidates[0];
    } else if (tbdCandidates.length > 1) {
      // Plusieurs candidats : prendre celui qui a le bon slot vide
      targetSeries = tbdCandidates.find(s =>
        placeAsTeam1 ? s.team1 === 'À déterminer' : s.team2 === 'À déterminer'
      ) || tbdCandidates[0];
    }
    // Si on a trouvé via fallback, assigner la bracket_position correcte
    if (targetSeries) {
      await sb.from('series').update({ bracket_position: destPos }).eq('id', targetSeries.id);
      targetSeries = { ...targetSeries, bracket_position: destPos };
    }
  }

  // Vérifier si l'équipe est déjà dans le bon slot de la série cible (éviter les doublons)
  if (targetSeries) {
    const alreadyPlaced = placeAsTeam1
      ? targetSeries.team1 === winnerTeam
      : targetSeries.team2 === winnerTeam;
    if (alreadyPlaced) return;
  }

  skipNextSeriesRealtime += 1;
  if (targetSeries) {
    const upd = placeAsTeam1
      ? { team1: winnerTeam, team1_seed: winnerSeed ?? null }
      : { team2: winnerTeam, team2_seed: winnerSeed ?? null };
    await sb.from('series').update(upd).eq('id', targetSeries.id);
  } else {
    const payload = {
      round: nextRound, conference: conf, status: 'upcoming',
      bracket_position: destPos, start_time: null,
      team1: placeAsTeam1 ? winnerTeam : 'À déterminer',
      team2: placeAsTeam1 ? 'À déterminer' : winnerTeam,
      team1_seed: placeAsTeam1 ? (winnerSeed ?? null) : null,
      team2_seed: placeAsTeam1 ? null : (winnerSeed ?? null),
    };
    const { data: newS } = await sb.from('series').insert(payload).select().single();
    if (newS) await create7Games(newS.id);
  }
}

async function addSeries(t1, t2, round, conf, startTime) {
  skipNextSeriesRealtime += 1;

  // Récupérer automatiquement les seeds depuis la table team_seeds (pour avantage terrain uniquement)
  const seed1 = state.teamSeeds[t1] ?? null;
  const seed2 = state.teamSeeds[t2] ?? null;

  // Attribuer la bracket_position globale correcte selon le ROUTING
  // Positions fixes : R1 Ouest 1-8, R1 Est 9-16, SF Ouest 17-20, SF Est 21-24, CF Ouest 25-26, CF Est 27-28, Finales 29
  const POSITION_SLOTS = {
    'Premier tour':            { 'Ouest': [1,3,5,7],  'Est': [9,11,13,15]  },
    'Demi-finales':            { 'Ouest': [17,19],    'Est': [21,23]        },
    'Finales de conférence':   { 'Ouest': [25],       'Est': [27]           },
    'Finales NBA':             { '—': [29]                                  },
  };

  const slots = POSITION_SLOTS[round]?.[conf] ?? [];
  const existingInRound = state.series.filter(s => s.round === round && s.conference === conf);
  const usedPositions = existingInRound.map(s => s.bracket_position).filter(p => p != null);
  const bracketPos = slots.find(p => !usedPositions.includes(p)) ?? null;

  const insertPayload = {
    team1: t1,
    team2: t2,
    round,
    conference: conf,
    start_time: startTime || null,
    status: 'upcoming'
  };
  if (seed1 != null) insertPayload.team1_seed = Number(seed1);
  if (seed2 != null) insertPayload.team2_seed = Number(seed2);
  insertPayload.bracket_position = bracketPos;

  const { data: newSeries, error } = await sb.from('series').insert(insertPayload).select().single();

  if (error) {
    skipNextSeriesRealtime = Math.max(0, skipNextSeriesRealtime - 1);
    return toast(`❌ Erreur ajout série : ${error.message}`);
  }

  // Auto-create 7 games
  if (newSeries) await create7Games(newSeries.id);

  await loadSeries();
  render();
  toast('✅ Série ajoutée avec 7 matchs');
}

function filterLoginPlayers(query) {
  const q = query.toLowerCase().trim();
  const btns = document.querySelectorAll('#ob-player-grid .player-select-btn');

  btns.forEach(btn => {
    const name = btn.dataset.name || '';
    const show = !q || name.includes(q);
    btn.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  const noResult = document.getElementById('ob-no-result');
  if (noResult) noResult.style.display = visible === 0 ? 'block' : 'none';
}

async function onboardCreate() {
  const name=document.getElementById('ob-name')?.value.trim();
  const pin=document.getElementById('ob-pin')?.value;
  const pin2=document.getElementById('ob-pin2')?.value;
  if(!name) return toast('Entre un prénom !');
  if(!/^\d{4}$/.test(pin)) return toast('Le PIN doit être 4 chiffres exactement.');
  if(pin!==pin2) return toast('Les PINs ne correspondent pas !');
  if(state.players.find(p=>p.name.toLowerCase()===name.toLowerCase())) return toast('❌ Ce prénom est déjà pris !');

  const player = await createPlayer(name, pin);
  if (!player) return;

  // Upload la photo si une a été sélectionnée
  if (_obAvatarFile) {
    const url = await uploadAvatar(_obAvatarFile, player.id);
    if (url) {
      await saveAvatarUrl(player.id, url);
      player.avatar_url = url;
    }
    _obAvatarFile = null;
  }

  await loadPlayers();
  computeLeaderboard();
  setCurrentPlayer(state.players.find(p => p.id === player.id) || player);

async function doLogin() {
  const pid = state.selectedLoginPlayer;
  const pin = document.getElementById('ob-login-pin')?.value;

  if (!pid) return toast('Sélectionne ton profil !');

  const player = state.players.find(p => p.id === pid);
  if (!player) return toast('Profil introuvable.');

  // PIN remis à zéro : le joueur doit en créer un nouveau
  if (!player.pin_hash) {
    const np = prompt(`Ton PIN a été réinitialisé. Choisis un nouveau PIN à 4 chiffres :`);
    if (!np) return;
    if (!/^\d{4}$/.test(np)) return toast('Le PIN doit contenir exactement 4 chiffres.');

    const c = prompt('Confirme ton nouveau PIN :');
    if (np !== c) return toast('Les deux PINs ne correspondent pas.');

    const { error } = await sb
      .from('players')
      .update({ pin_hash: await hashPin(np) })
      .eq('id', pid);

    if (error) {
      console.error(error);
      return toast(`❌ Erreur création PIN : ${error.message}`);
    }

    await loadPlayers();
    const updated = state.players.find(p => p.id === pid) || player;
    setCurrentPlayer(updated);
    toast('✅ Nouveau PIN enregistré');
    return;
  }

  if (!pin) return toast('Entre ton PIN !');

  if (!(await verifyPin(player, pin))) return toast('❌ PIN incorrect !');

  setCurrentPlayer(player);
}

  const ptsMvpCF = Number(state.settings['points_mvp_finales_conference'] ?? 4);
  const ptsMvpFN = Number(state.settings['points_mvp_finales_nba'] ?? 8);
  const actualMvp = String(state.settings['actual_mvp'] ?? '').trim().toLowerCase();

  const timeline = [];
  const totals = {};
  const awardedGamePoints = new Set();
  const awardedSeriesWinnerPoints = new Set();
  const awardedSeriesExactPoints = new Set();
  const awardedMvpPoints = new Set();

  playersToChart.forEach(p => {
    totals[p.id] = 0;
  });

  const events = [];

  Object.values(state.games).flat().forEach(g => {
    if (g.status === 'finished' && g.winner) {
      events.push({
        type: 'game',
        sortDate: g.updated_at || g.start_time || '',
        game: g
      });
    }
  });

  state.series.forEach(s => {
    if (s.status === 'finished' && s.series_winner) {
      events.push({
        type: 'series',
        sortDate: s.updated_at || s.start_time || '',
        series: s
      });
    }
  });

  if (actualMvp) {
    state.mvpPredictions.forEach(mp => {
      events.push({
        type: 'mvp',
        sortDate: mp.updated_at || '',
        mvpPrediction: mp
      });
    });
  }

  events.sort((a, b) => String(a.sortDate).localeCompare(String(b.sortDate)));

  function pushSnapshot(label) {
    timeline.push({
      label,
      points: playersToChart.map(p => ({
        player_id: p.id,
        name: p.name,
        color: p.avatar_color,
        total: totals[p.id] || 0
      }))
    });
  }

  events.forEach(ev => {
    if (ev.type === 'game') {
      const g = ev.game;
      const s = state.series.find(x => x.id === g.series_id);
      if (!s) return;

      const roundPoints = getRoundPoints(s.round);
      const ptsMW = roundPoints.match;
      const keyBase = `${g.series_id}::${g.game_number}`;

      state.predictions
        .filter(pred => pred.series_id === g.series_id)
        .forEach(pred => {
          if (!playersToChart.some(p => p.id === pred.player_id)) return;
          const gp = Array.isArray(pred.game_predictions)
            ? pred.game_predictions.find(x => Number(x.game_number) === Number(g.game_number))
            : null;

          if (!gp) return;
          if (gp.predicted_winner !== g.winner) return;

          const awardKey = `${pred.player_id}::${keyBase}`;
          if (awardedGamePoints.has(awardKey)) return;

          const dd = state.doubleDowns.find(d => d.player_id === pred.player_id && d.series_id === g.series_id);
          totals[pred.player_id] = (totals[pred.player_id] || 0) + ptsMW * (dd ? 2 : 1);
          awardedGamePoints.add(awardKey);
        });

      pushSnapshot(`${shortTeamName(s.team1)}-${shortTeamName(s.team2)} · M${g.game_number}`);
    }

    if (ev.type === 'series') {
      const s = ev.series;
      const roundPoints = getRoundPoints(s.round);
      const ptsSW = roundPoints.series;
      const ptsSE = roundPoints.exact;

      state.predictions
        .filter(pred => pred.series_id === s.id && playersToChart.some(p => p.id === pred.player_id))
        .forEach(pred => {
          const winKey = `${pred.player_id}::${s.id}::winner`;
          const exactKey = `${pred.player_id}::${s.id}::exact`;
          const dd = state.doubleDowns.find(d => d.player_id === pred.player_id && d.series_id === s.id);
          const mult = dd ? 2 : 1;

          if (
            pred.predicted_series_winner === s.series_winner &&
            !awardedSeriesWinnerPoints.has(winKey)
          ) {
            totals[pred.player_id] = (totals[pred.player_id] || 0) + ptsSW * mult;
            awardedSeriesWinnerPoints.add(winKey);
          }

          if (
            pred.predicted_series_winner === s.series_winner &&
            Number(pred.predicted_series_games) === Number(s.series_games) &&
            !awardedSeriesExactPoints.has(exactKey)
          ) {
            totals[pred.player_id] = (totals[pred.player_id] || 0) + ptsSE * mult;
            awardedSeriesExactPoints.add(exactKey);
          }
        });

      pushSnapshot(`${shortTeamName(s.team1)}-${shortTeamName(s.team2)} · Série`);
    }

    if (ev.type === 'mvp') {
      const mp = ev.mvpPrediction;
      const predictedMvp = String(mp.predicted_mvp ?? '').trim().toLowerCase();
      if (!predictedMvp || predictedMvp !== actualMvp) return;

      const mvpKey = `${mp.player_id}::${mp.playoff_round}::${predictedMvp}`;
      if (awardedMvpPoints.has(mvpKey)) return;

      let pts = 0;
      if (mp.playoff_round === 'Premier tour') pts = ptsMvpR1;
      else if (mp.playoff_round === 'Demi-finales') pts = ptsMvpSF;
      else if (mp.playoff_round === 'Finales de conférence') pts = ptsMvpCF;
      else if (mp.playoff_round === 'Finales NBA') pts = ptsMvpFN;

      if (pts > 0) {
        totals[mp.player_id] = (totals[mp.player_id] || 0) + pts;
        awardedMvpPoints.add(mvpKey);
        pushSnapshot(`MVP · ${mp.playoff_round}`);
      }
    }
  });

  return timeline;
}

function renderLeaderboardTrendChart() {
  // Top 10 du classement actuellement affiché (global ou league)
  const TOP_N = 10;
  const filteredLb = getFilteredLeaderboard().slice(0, TOP_N);
  const topPlayerIds = new Set(filteredLb.map(p => p.id));
  const playersToChart = state.players.filter(p => topPlayerIds.has(p.id))
    // Trier dans le même ordre que le classement filtré
    .sort((a, b) => {
      const ra = filteredLb.findIndex(p => p.id === a.id);
      const rb = filteredLb.findIndex(p => p.id === b.id);
      return ra - rb;
    });

  const timeline = buildLeaderboardTimeline(playersToChart);
  const totalPlayers = getFilteredLeaderboard().length;
  const isTruncated = totalPlayers > TOP_N;

  if (!timeline.length) {
    return `
      <div class="card">
        <div style="font-size:13px;color:var(--muted)">
          Le graphique apparaîtra dès que des matchs ou séries auront été validés.
        </div>
      </div>
    `;
  }

  const width = 320;
  const height = 220;

  const padL = 28;
  const padR = 10;
  const padT = 12;
  const padB = 24;

  const innerW = width - padL - padR;
  const innerH = height - padT - padB;

  const allValues = timeline.flatMap(step => step.points.map(p => p.total));
  const rawMaxY = Math.max(1, ...allValues);
  const maxY = Math.ceil(rawMaxY * 1.1);

  // Axe X auto-ajusté selon le nombre d'étapes
  const xAt = i => {
    if (timeline.length <= 1) return padL + innerW / 2;
    return padL + (i / (timeline.length - 1)) * innerW;
  };

  // Axe Y auto-ajusté selon le score max
  const yAt = v => padT + innerH - (v / maxY) * innerH;

  const gridLines = 4;
  const yGrid = Array.from({ length: gridLines + 1 }, (_, i) => {
    const val = Math.round((maxY * i) / gridLines);
    const y = yAt(val);
    return `
      <line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="rgba(255,255,255,0.08)" />
      <text x="${padL - 6}" y="${y + 3}" text-anchor="end" font-size="9" fill="rgba(200,205,240,0.5)">${val}</text>
    `;
  }).join('');

  const xLabels = '';

  // CHART_PALETTE est déclarée globalement plus bas
  // Dash patterns variés pour différencier même si deux couleurs se ressemblent
  const DASH_PATTERNS = [
    '',           // solide
    '6,3',        // tiret court
    '2,3',        // pointillé
    '8,3,2,3',    // tiret-point
    '10,4',       // tiret long
    '4,2,4,2',    // tiret double
    '1,4',        // points espacés
    '8,3,2,3,2,3',// tiret-point-point
    '12,3',       // tiret très long
    '3,3',        // tirets égaux
    '6,2,2,2',    // tiret-micro-point
    '5,5',        // tirets larges
  ];
  const chartColorOf = idx => CHART_PALETTE[idx % CHART_PALETTE.length];
  const dashOf = idx => DASH_PATTERNS[idx % DASH_PATTERNS.length];

  const chartId = 'chart_' + Math.random().toString(36).slice(2, 7);

  const lines = playersToChart.map((player, idx) => {
    const color = chartColorOf(idx);
    const dash = dashOf(idx);
    const dashAttr = dash ? `stroke-dasharray="${dash}"` : '';
    const pts = timeline.map(step => {
      const row = step.points.find(p => p.player_id === player.id);
      return row ? row.total : 0;
    });

    const d = pts.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xAt(i)} ${yAt(v)}`).join(' ');

    

    return `
      <path class="chart-line-${chartId}" data-pidx="${idx}" d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${dashAttr} style="transition:opacity .2s,stroke-width .2s" />
    `;
  }).join('');

  const legend = playersToChart.map((player, idx) => {
    const color = chartColorOf(idx);
    const dash = dashOf(idx);
    // Miniature SVG de la ligne dans la légende
    const linePreview = `<svg width="18" height="10" style="flex-shrink:0;overflow:visible"><line x1="0" y1="5" x2="18" y2="5" stroke="${color}" stroke-width="2" ${dash ? `stroke-dasharray="${dash}"` : ''}/></svg>`;
    return `
    <div class="chart-legend-item-${chartId}" data-pidx="${idx}" onclick="toggleChartLine('${chartId}', ${idx}, ${playersToChart.length})"
      style="display:flex;align-items:center;gap:5px;font-size:11px;cursor:pointer;padding:3px 7px;border-radius:8px;border:1px solid transparent;transition:all .15s;user-select:none">
      ${linePreview}
      <span>${player.name}</span>
    </div>`;
  }).join('');

  const lastStep = timeline[timeline.length - 1];

  return `
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px">
        <div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:800;text-transform:uppercase">
            Évolution
          </div>
          <div style="font-size:11px;color:var(--muted)">
            Points cumulés par étape · <span style="opacity:.6">Tap un joueur pour isoler</span>
            ${isTruncated ? `· <span style="color:var(--gold)">Top ${TOP_N} affiché</span>` : ''}
          </div>
        </div>
        <span class="badge badge-blue">${timeline.length}</span>
      </div>

      <div style="overflow-x:auto">
        <svg id="svg_${chartId}" viewBox="0 0 ${width} ${height}" style="width:100%;min-width:320px;height:auto;display:block">
          ${yGrid}
          <line x1="${padL}" y1="${height - padB}" x2="${width - padR}" y2="${height - padB}" stroke="rgba(255,255,255,0.12)" />
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${height - padB}" stroke="rgba(255,255,255,0.12)" />
          ${lines}
          ${xLabels}
        </svg>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">
        ${legend}
      </div>

      <div style="margin-top:8px;font-size:10px;color:var(--muted)">
        Dernière étape : ${lastStep.label}
      </div>
    </div>
  `;
}

function toggleChartLine(chartId, pidx, total) {
  const lines = document.querySelectorAll(`.chart-line-${chartId}`);
  const items = document.querySelectorAll(`.chart-legend-item-${chartId}`);

  // Si ce joueur est déjà isolé (seul visible), on réinitialise tout
  const onlyThisActive = [...lines].every((el, i) =>
    i === pidx ? parseFloat(el.style.opacity || 1) > 0.5 : parseFloat(el.style.opacity || 1) < 0.5
  );

  if (onlyThisActive) {
    // Réinitialiser tout
    lines.forEach(el => { el.style.opacity = '1'; el.style.strokeWidth = '2.2'; });
    items.forEach(el => { el.style.border = '1px solid transparent'; el.style.background = 'transparent'; el.style.opacity = '1'; });
  } else {
    // Isoler ce joueur
    lines.forEach((el, i) => {
      const active = i === pidx;
      el.style.opacity = active ? '1' : '0.08';
      el.style.strokeWidth = active ? '3' : '2.2';
    });
    items.forEach((el, i) => {
      const active = i === pidx;
      el.style.opacity = active ? '1' : '0.35';
      el.style.border = active ? `1px solid ${CHART_PALETTE[pidx % CHART_PALETTE.length]}44` : '1px solid transparent';
      el.style.background = active ? `${CHART_PALETTE[pidx % CHART_PALETTE.length]}18` : 'transparent';
    });
  }
}

function _renderLeaderboardWithLive() {
  const lb = getFilteredLeaderboard();
  if (!lb.length) return '<div id="lb-live-projection"></div>';
  const hasLive = Object.keys(state.liveScores).length > 0;
  if (!hasLive) return '<div id="lb-live-projection"></div>';

  const delta = computeLiveDelta();
  // Calculer le classement projeté
  const projected = lb.map(p => ({
    ...p,
    proj_total: p.total_points + (delta[p.id]?.pts || 0),
    delta: delta[p.id]?.pts || 0,
    hasPred: delta[p.id]?.hasPred || false,
  })).sort((a, b) => b.proj_total - a.proj_total);

  // Calculer le mouvement de rang
  const currentRanks = {};
  lb.forEach((p, i) => { currentRanks[p.id] = i; });
  const projRanks = {};
  projected.forEach((p, i) => { projRanks[p.id] = i; });

  // Construire le badge LIVE avec le nom du match
  const liveSeriesNames = Object.entries(state.liveScores).map(([sid, live]) => {
    const s = state.series.find(x => x.id === sid);
    return s ? `${shortTeamName(s.team1)} ${live.team1Score} – ${live.team2Score} ${shortTeamName(s.team2)} · M${live.gameNumber} · ${live.periodLabel} ${live.clock}` : '';
  }).filter(Boolean).join(' · ');

  const cp = state.currentPlayer;

  return `<div id="lb-live-projection">
    <div class="section-label" style="color:var(--amber)">
      <span style="display:inline-block;width:7px;height:7px;border-radius:50%;
                   background:var(--amber);animation:pulse 1.4s infinite;margin-right:6px;vertical-align:middle"></span>

    <div class="card" style="border-color:rgba(245,158,11,0.25);background:rgba(245,158,11,0.04)">
      <div style="font-size:11px;color:var(--amber);font-weight:600;margin-bottom:10px;
                  display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        🏀 ${liveSeriesNames}
      </div>
      ${projected.map((p, projRank) => {
        const currRank = currentRanks[p.id];
        const rankMove = currRank - projRank; // positif = monte
        const arrow = rankMove > 0 ? '↑' : rankMove < 0 ? '↓' : '–';
        const arrowColor = rankMove > 0 ? 'var(--green)' : rankMove < 0 ? 'var(--red)' : 'var(--muted)';
        const deltaStr = p.delta > 0 ? `+${p.delta}` : p.delta < 0 ? `${p.delta}` : '';
        const isMe = p.id === cp?.id;

        return `
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;
                    border-bottom:1px solid var(--border);
                    ${isMe ? 'background:rgba(232,66,42,0.05);margin:0 -16px;padding:8px 16px;' : ''}">

                       min-width:22px;text-align:center;color:var(--muted)">${projRank + 1}</span>
          <span style="font-size:15px;font-weight:700;color:${arrowColor};min-width:14px;text-align:center">${arrow}</span>
          ${avatarImg(p, '32px')}
          <div style="flex:1">
            <div style="font-size:14px;font-weight:600">${p.name}${isMe ? ' <span style="font-size:10px;color:var(--accent)">toi</span>' : ''}</div>

// ── PREDICTIONS ──
function renderPredictions() {
  if(!state.series.length) return `<div class="empty"><span class="empty-icon">📋</span>Aucune série disponible.<br>L'admin doit les ajouter.</div>`;
  const ROUND_ORDER = ['Premier tour','Demi-finales','Finales de conférence','Finales NBA'];
  const activeSeries = state.series.filter(s =>
    s.status !== 'finished' &&
    s.team1 && s.team1 !== 'À déterminer' &&
    s.team2 && s.team2 !== 'À déterminer'
  );
  if (!activeSeries.length) return `<div class="empty"><span class="empty-icon">✅</span>Toutes les séries sont terminées.<br>Consulte l'onglet Séries pour les résultats.</div>`;
  const rounds = [...new Set(activeSeries.map(s => s.round))].sort((a,b) => ROUND_ORDER.indexOf(a) - ROUND_ORDER.indexOf(b));
  return rounds.map(r => {
    const ss = activeSeries.filter(s => s.round === r).sort((a, b) => {
      const aLocked = isLocked(a);
      const bLocked = isLocked(b);
      if (aLocked !== bLocked) return aLocked ? 1 : -1;
      const aTime = a.start_time ? new Date(a.start_time).getTime() : Infinity;
      const bTime = b.start_time ? new Date(b.start_time).getTime() : Infinity;
      return aTime - bTime;
    });
    return '<div class="section-label">' + r + '</div>' + ss.map(s => renderPredCard(s)).join('');
  }).join('');
}

  const pid = s.id.replace(/-/g, '_');

  // Compute series score from finished games
  const finishedGames = sGames.filter(g => g.status === 'finished');
  let wins1 = 0, wins2 = 0;
  finishedGames.forEach(g => {
    if (g.winner === s.team1) wins1++;
    else if (g.winner === s.team2) wins2++;

// État accordéon pour "Mes picks"
const myPicksOpen = {};

function renderMyPicks() {
  if (!state.currentPlayer) return '';

  const myPreds = state.predictions.filter(p => p.player_id === state.currentPlayer.id);
  const mvpRounds = ['Premier tour','Demi-finales','Finales de conférence','Finales NBA'];
  const ROUND_ORDER = ['Premier tour','Demi-finales','Finales de conférence','Finales NBA'];

  const todo = state.series.filter(s => {
    const hasPred = myPreds.some(pr => pr.series_id === s.id);
    const bothTeamsKnown = s.team1 && s.team2 && s.team1 !== 'À déterminer' && s.team2 !== 'À déterminer';
    return !hasPred && !isLockedSeriesForMyPick(s) && bothTeamsKnown;
  }).sort((a, b) => {
    const aTime = a.start_time ? new Date(a.start_time).getTime() : Infinity;
    const bTime = b.start_time ? new Date(b.start_time).getTime() : Infinity;
    return aTime - bTime;
  });

  const doneByRound = {};
  state.series.forEach(s => {
    const pred = myPreds.find(pr => pr.series_id === s.id);
    if (!pred) return;
    if (!doneByRound[s.round]) doneByRound[s.round] = [];
    doneByRound[s.round].push({ series: s, pred });
  });

  const roundsHTML = ROUND_ORDER
    .filter(r => doneByRound[r]?.length)
    .map(r => {
      const items = doneByRound[r];
      const safeId = 'mypicks_' + r.replace(/\s+/g,'_').replace(/[^a-zA-Z0-9_]/g,'');
      if (myPicksOpen[r] === undefined) {
        myPicksOpen[r] = items.some(({series}) => series.status !== 'finished');
      }
      const isOpen = myPicksOpen[r];
      const finishedCount = items.filter(({series}) => series.status === 'finished').length;
      return `
        <div style="margin:0 12px 6px">
          <button onclick="toggleMyPicksRound('${r}')"
            style="width:100%;display:flex;align-items:center;justify-content:space-between;
                   background:var(--card);border:1px solid var(--border2);border-radius:16px;
                   padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s;text-align:left"
            onmouseover="this.style.background='var(--card2)';this.style.borderColor='rgba(255,255,255,0.2)'"
            onmouseout="this.style.background='var(--card)';this.style.borderColor='var(--border2)'">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:16px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text)">${r}</span>
              <span style="font-size:11px;color:var(--muted)">${finishedCount}/${items.length} terminée(s)</span>
            </div>
            <span style="font-size:16px;color:var(--muted);display:inline-block;transform:rotate(${isOpen?'180':'0'}deg);transition:transform .3s"
                  id="${safeId}_arrow">▼</span>
          </button>

function renderMyPickCard(s, p) {
  const allGames = state.games[s.id] || [];
  const isFinished = s.status === 'finished';
  const isLocked = s.status === 'locked' || isLockedSeriesForMyPick(s);

  // Ne montrer que les matchs pertinents :
  // - Si la série est terminée : uniquement les matchs joués
  // - Sinon : matchs joués + prochain match à venir (premier non terminé)
  let games;
  if (isFinished) {
    games = allGames.filter(g => g.status === 'finished');
  } else {
    const played = allGames.filter(g => g.status === 'finished');
    const nextGame = allGames.find(g => g.status !== 'finished');
    games = nextGame ? [...played, nextGame] : played;
  }
  games = games.slice().sort((a, b) => a.game_number - b.game_number);

  const roundPoints = getRoundPoints(s.round);
  const ptsMW = roundPoints.match;
  const ptsSW = roundPoints.series;
  const ptsSE = roundPoints.exact;

  let pointsGames = 0;
  let pointsSeriesWinner = 0;
  let pointsSeriesExact = 0;

  const gamePreds = p.game_predictions || [];

  allGames.forEach(g => {
    if (g.status !== 'finished' || !g.winner) return;
    const gp = gamePreds.find(x => Number(x.game_number) === Number(g.game_number));
    if (gp && gp.predicted_winner === g.winner) pointsGames += ptsMW;
  });

  if (isFinished && s.series_winner) {
    if (p.predicted_series_winner === s.series_winner) {
      pointsSeriesWinner = ptsSW;
      if (Number(p.predicted_series_games) === Number(s.series_games)) {
        pointsSeriesExact = ptsSE;
      }
    }
  }

  const hasDD = !!myDoubleDown(s.id);
  const ddActive = hasDD && pointsSeriesWinner > 0;
  const displayGames = ddActive ? pointsGames * 2 : pointsGames;
  const displaySW = ddActive ? pointsSeriesWinner * 2 : pointsSeriesWinner;
  const displaySE = ddActive ? pointsSeriesExact * 2 : pointsSeriesExact;
  const displayTotal = displayGames + displaySW + displaySE;

  let statusBadge = '';
  if (isFinished) statusBadge = `<span class="badge badge-green">Terminé</span>`;
  else if (isLocked) statusBadge = `<span class="badge badge-amber">Verrouillé</span>`;
  else statusBadge = `<span class="badge badge-blue">Ouvert</span>`;

  // Résultat réel vs pronostic (série terminée)
  const predWinOk = isFinished && p.predicted_series_winner === s.series_winner;
  const predExactOk = predWinOk && Number(p.predicted_series_games) === Number(s.series_games);

  return `
    <div style="padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px">
        <div>
          <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em">
            ${s.conference && s.conference !== '—' ? `${s.conference} · ` : ''}${s.round}
          </div>
          <div style="font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;line-height:1.1">
            ${s.team1} <span style="color:var(--muted)">vs</span> ${s.team2}
          </div>
        </div>
        ${statusBadge}
      </div>

      ${isFinished ? `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">
          <div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:10px 12px">
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Mon prono</div>
            <div style="font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px">
              🧠 ${p.predicted_series_winner} en ${p.predicted_series_games}
              ${hasDD ? `<span class="dd-badge" style="font-size:9px">🎲</span>` : ''}
            </div>
          </div>
          <div style="background:rgba(29,185,84,0.07);border:1px solid rgba(29,185,84,0.2);border-radius:12px;padding:10px 12px">
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px">Résultat réel</div>
            <div style="font-size:14px;font-weight:700;color:var(--green)">
              🏆 ${s.series_winner} en ${s.series_games}
            </div>
          </div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">
          <span class="pts-chip ${displayGames > 0 ? 'hit' : ''}">🏀 Matchs : +${displayGames}</span>
          <span class="pts-chip ${displaySW > 0 ? 'hit' : ''}">📊 Série : ${predWinOk ? '+' + displaySW + ' ✓' : '✗'}</span>
          <span class="pts-chip ${displaySE > 0 ? 'hit' : ''}">🎯 Exact : ${predExactOk ? '+' + displaySE + ' ✓' : '✗'}</span>
          ${ddActive ? `<span class="pts-chip hit" style="background:rgba(245,197,24,0.15);border-color:rgba(245,197,24,0.35);color:var(--gold)">🎲 doublé !</span>` : ''}
        </div>
      ` : `
        <div style="background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px">Mon pronostic</div>
          <div style="font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px">
            🧠 ${p.predicted_series_winner} en ${p.predicted_series_games}
            ${hasDD ? `<span class="dd-badge">🎲 ×2</span>` : ''}
          </div>
          ${hasDD ? `
            <div class="dd-info-box" style="margin-top:8px">
              <span>🎲</span><span>Bonus risqué activé — points doublés si tu trouves le bon vainqueur</span>
            </div>
          ` : ''}
        </div>
      `}

      ${games.length ? `
        <div style="margin-top:4px">
          <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px">
            Mes matchs
          </div>
          ${games.map(g => {
            const gp = gamePreds.find(x => Number(x.game_number) === Number(g.game_number));
            const predicted = gp?.predicted_winner || '—';
            const correct = g.status === 'finished' && gp && gp.predicted_winner === g.winner;
            return `
              <div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:12px">
                <span style="color:var(--muted);min-width:52px">M${g.game_number}</span>
                <span style="flex:1;font-weight:600">${predicted}</span>
                ${g.status === 'finished'
                  ? `<span style="font-size:11px;color:var(--muted)">${g.winner}</span>
                     <span class="badge ${correct ? 'badge-green' : 'badge-red'}">${correct ? '✓' : '✗'}</span>`
                  : `<span class="badge badge-gray">à venir</span>`}
              </div>
            `;
          }).join('')}
        </div>
      ` : ''}

      ${isFinished ? `
        <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
          <span style="font-size:12px;color:var(--muted)">Total gagné sur cette série</span>
          <span style="font-family:'Barlow Condensed',sans-serif;font-size:28px;font-weight:800;color:${ddActive ? 'var(--gold)' : displayTotal > 0 ? 'var(--green)' : 'var(--muted)'}">
            +${displayTotal}${ddActive ? ' 🎲' : ''}
          </span>
        </div>
      ` : `
        <div style="margin-top:10px;font-size:12px;color:var(--muted)">
          ${isLocked ? 'Les pronostics sont verrouillés pour cette série.' : 'Cette série est encore en cours.'}
        </div>
      `}
    </div>
  `;
}

function getMatchup(g, s) {
  // L'equipe avec le seed le plus bas a l'avantage du terrain (M1,2,5,7 a domicile)
  const seed1 = getTeamSeed(s.team1, s, 1);
  const seed2 = getTeamSeed(s.team2, s, 2);
  // Si seeds inconnus, team1 a l'avantage par defaut
  const homeTeam = (seed1 != null && seed2 != null && seed2 < seed1) ? s.team2 : s.team1;
  const awayTeam = (seed1 != null && seed2 != null && seed2 < seed1) ? s.team1 : s.team2;
  const homeGames = [1,2,5,7];
  const home = homeGames.includes(Number(g.game_number)) ? homeTeam : awayTeam;
  const away = homeGames.includes(Number(g.game_number)) ? awayTeam : homeTeam;
  return `${away} @ ${home}`;
}

function pickGameWinner(seriesId, gid, gameNumber, team) {

async function submitPred(seriesId, pid, team1, team2) {
  const mp = myPred(seriesId);
  const tmp = predTemp[pid] || {};

  const winner = tmp.winner !== undefined ? tmp.winner : mp?.predicted_series_winner;
  const games = tmp.games !== undefined ? tmp.games : (mp ? Number(mp.predicted_series_games) : null);

  if (!winner) return toast('Choisis le vainqueur !');
  if (!games) return toast('Choisis le nombre de matchs !');

  const gpKey = `gp_${seriesId}`;
  const tmpGP = predTemp[gpKey]?.gamePreds || {};
  const existingGP = mp?.game_predictions || [];
  const sGames = state.games[seriesId] || [];

  const gamePredsList = sGames.map(g => {
    const tw = tmpGP[g.game_number];
    const ew = existingGP.find(p => Number(p.game_number) === Number(g.game_number))?.predicted_winner;
    const pw = tw || ew || null;
    return pw ? { game_number: Number(g.game_number), predicted_winner: pw } : null;
  }).filter(Boolean);

  // ✅ Nouveau verrou : obliger tous les matchs à être pronostiqués
  const unlockedGames = sGames.filter(g => g.status !== 'finished');

  const missingGameNumbers = unlockedGames
    .filter(g => {
      const gp = gamePredsList.find(p => Number(p.game_number) === Number(g.game_number));
      return !gp || !gp.predicted_winner;
    })
    .map(g => g.game_number);

  if (missingGameNumbers.length) {
    return toast('Tu dois renseigner les 7 matchs avant de valider.');
  }

  const ok = await savePrediction(seriesId, winner, games, gamePredsList);
  if (!ok) return;

  delete predTemp[pid];
  delete predTemp[`gp_${seriesId}`];
  stopEditingSeries(seriesId);

  render();
}

  const maxGame = sGames.length ? Math.max(...sGames.map(g => g.game_number)) : 7;
  const gameCols = sGames.slice(0, maxGame);

  // Header row

    const isFinished = g.status === 'finished';
    return `<th>${isFinished ? '🏆' : ''}<br>M${g.game_number}</th>`;
  }).join('');

  // Result row (actual results)
  const tdResults = gameCols.map(g => {
    if (g.status !== 'finished') return `<td><span class="pt-cell empty">—</span></td>`;
    return `<td><span class="pt-cell hit" style="background:rgba(29,185,84,0.2);color:var(--green);border-color:rgba(29,185,84,0.4)">${shortTeamName(g.winner)}</span></td>`;
  }).join('');

  // Player rows
  const playerRows = ap.map(pr => {
    const pl = getPlayer(pr.player_id);
    if (!pl) return '';
    const isMe = pl.id === cp?.id;
    const gamePreds = Array.isArray(pr.game_predictions) ? pr.game_predictions : [];
    const isSeriesFinished = s.status === 'finished';
    const seriesHit = isSeriesFinished && pr.predicted_series_winner === s.series_winner;
    const seriesExact = seriesHit && Number(pr.predicted_series_games) === Number(s.series_games);
    const seriesCls = seriesExact ? 'series-exact' : seriesHit ? 'series-hit' : '';

    const tdGames = gameCols.map(g => {
      const gp = gamePreds.find(p => Number(p.game_number) === Number(g.game_number));
      const pred = gp?.predicted_winner;
      if (!pred) return `<td><span class="pt-cell empty">—</span></td>`;
      if (g.status !== 'finished') return `<td><span class="pt-cell pending">${shortTeamName(pred)}</span></td>`;
      const hit = pred === g.winner;
      return `<td><span class="pt-cell ${hit ? 'hit' : 'miss'}">${shortTeamName(pred)}</span></td>`;
    }).join('');

    return `<tr>
      <td>
        <div class="pt-player">
          ${avatarImg(pl, '26px')}
          <div class="pt-name">${pl.name}${isMe ? ' <span style="font-size:9px;color:var(--accent)">toi</span>' : ''}</div>
        </div>
      </td>
      <td><span class="pt-series ${seriesCls}">${shortTeamName(pr.predicted_series_winner)} en ${pr.predicted_series_games}</span></td>
      ${tdGames}
    </tr>`;
  }).join('');

  const html = `
    <div class="preds-overlay" id="preds-overlay" onclick="closePredsTable(event)">
      <div class="preds-sheet" onclick="event.stopPropagation()">
        <div class="preds-sheet-handle"></div>
        <div class="preds-sheet-header">
          <div>
            <div class="preds-sheet-title">
              ${s.team1} <span style="color:var(--muted);font-weight:400">vs</span> ${s.team2}
            </div>
            <div class="preds-sheet-sub">
              ${s.conference && s.conference !== '—' ? s.conference + ' · ' : ''}${s.round}
            </div>
          </div>
          <button class="btn btn-sm btn-ghost" onclick="document.getElementById('preds-overlay').remove()">✕</button>
        </div>
        <div class="preds-table-wrap">
          <table class="preds-table">
            <thead>
              <tr>
                <th>Joueur</th>
                <th>Série</th>
                ${thGames}
              </tr>
            </thead>
            <tbody>
              ${s.status === 'finished' || sGames.some(g => g.status === 'finished') ? `
              <tr class="result-row">
                <td style="font-size:10px;color:var(--muted);font-weight:700;letter-spacing:0.06em;text-transform:uppercase">Résultat</td>
                <td>${s.status === 'finished' ? `<span class="pt-series series-hit">${shortTeamName(s.series_winner)} en ${s.series_games}</span>` : '<span style="color:var(--dim);font-size:11px">En cours</span>'}</td>
                ${tdResults}
              </tr>` : ''}
              ${playerRows}
            </tbody>
          </table>
        </div>
        <div style="padding:10px 16px 0;font-size:11px;color:var(--muted)">
  <span class="pt-cell hit">bon</span>
  <span class="pt-cell miss" style="margin-left:6px">raté</span>
  <span class="pt-cell pending" style="margin-left:6px">à venir</span>
</div>
        <div style="padding:14px 16px 0;flex-shrink:0">
          <button class="btn btn-ghost btn-block btn-sm" onclick="document.getElementById('preds-overlay').remove()">Fermer</button>
        </div>
      </div>
    </div>`;

  document.body.insertAdjacentHTML('beforeend', html);
}
